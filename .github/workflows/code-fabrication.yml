  push:
    branches: ["**"]
    paths:
      - "src/exact-source-edits.mjs"
      - "src/workspace-path-relocation.mjs"
      - "src/typed-operation.mjs"
      - "src/operation-schema-topology.mjs"
      - "test/operation-schema-topology.test.mjs"
      - "test/typed-operation.test.mjs"
      - "services/javascript-engineering-services-section/services/javascript-node-services-section/services/node-runtime-authority-services-section/services/node-runtime-release-promotion-service/src/install-workspace-selection.mjs"
      - "services/javascript-engineering-services-section/services/javascript-node-services-section/services/node-runtime-authority-services-section/services/node-runtime-release-promotion-service/test/install-workspace-selection.test.mjs"
      - "services/javascript-engineering-services-section/services/javascript-node-services-section/services/node-runtime-authority-services-section/services/node-runtime-release-promotion-service/test/pnpm-exact-importer.integration.test.mjs"
