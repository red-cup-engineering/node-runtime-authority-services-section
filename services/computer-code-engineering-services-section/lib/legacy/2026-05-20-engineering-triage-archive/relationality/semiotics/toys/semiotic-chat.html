<div id="main">

      Nodes:
      <span style="color:#1e88e5;">Atoms</span>,

      <span style="color:#43a047;">Conjunctions</span>,
      <span style="color:#7b1fa2;">Boxed / Stable</span>.
      Edges: entailments (S_sem:..., etc). Drag nodes; click to inspect.

  </div>

<script>
/* ===========================================================
   SECTION 2: SEMIOTIC UNIVERSE – DATA MODEL & CLOSURE
   =========================================================== */

/*
  We store in localStorage["semiotic_cell_v011"]:

  cell = {
    semantic: [
      { id, term: {tag, ...}, tags: [str] }
    ],
    entails: [
      { from, to, reason }
    ],
    counter: { next_id }
  }

  Term types:
    - {tag:"atom", name: string}
    - {tag:"proto", arg: term}
    - {tag:"impl", args:[term, term]}
    - {tag:"and", args:[term, ...]}
    - {tag:"box", arg: term}
    - {tag:"trace", arg: term}
*/

/* ---------- Storage ---------- */

function emptyCell() {
  return {
    semantic: [],
    entails: [],
    counter: { next_id: 1 }
  };
}

function loadCell() {
  const raw = localStorage.getItem("semiotic_cell_v011");
  if (!raw) {
    const empty = emptyCell();
    localStorage.setItem("semiotic_cell_v011", JSON.stringify(empty));
    return empty;
  }
  return JSON.parse(raw);
}

function saveCell(cell) {
  localStorage.setItem("semiotic_cell_v011", JSON.stringify(cell));
}

/* ---------- Term equality & canonicalization ---------- */

function termsEqual(a, b) {
  if (typeof a !== "object" || typeof b !== "object" || !a || !b) {
    return a === b;
  }
  const ak = Object.keys(a).sort();
  const bk = Object.keys(b).sort();
  if (ak.length !== bk.length) return false;
  for (let i = 0; i < ak.length; i++) {
    if (ak[i] !== bk[i]) return false;
  }
  for (const k of ak) {
    if (!termsEqual(a[k], b[k])) return false;
  }
  return true;
}

function canonicalTerm(term) {
  return JSON.stringify(term, Object.keys(term).sort());
}

/* ---------- AND normalization ---------- */

function flattenAnd(term) {
  if (!term || term.tag !== "and") return [term];
  const flat = [];
  for (const t of term.args) {
    if (t && t.tag === "and") {
      flat.push(...flattenAnd(t));
    } else {
      flat.push(t);
    }
  }
  return flat;
}

function normalizeTerm(term) {
  if (!term || typeof term !== "object") return term;
  const tag = term.tag;
  if (tag === "and") {
    let children = flattenAnd(term).map(normalizeTerm);
    const seen = {};
    const unique = [];
    for (const c of children) {
      const k = canonicalTerm(c);
      if (!seen[k]) {
        seen[k] = true;
        unique.push(c);
      }
    }
    unique.sort((a,b) =>
      canonicalTerm(a) < canonicalTerm(b) ? -1 :
      canonicalTerm(a) > canonicalTerm(b) ? 1 : 0
    );
    if (unique.length === 0) return {tag:"atom", name:"⊤"};
    if (unique.length === 1) return unique[0];
    return {tag:"and", args: unique};
  }
  if (tag === "box" || tag === "proto" || tag === "trace" || tag === "stable") {
    const inner = normalizeTerm(term.arg);
    if (tag === "box" && inner && inner.tag === "box") {
      return inner; // box(box(t)) -> box(t)
    }
    return {tag, arg: inner};
  }
  if (tag === "impl") {
    return {
      tag: "impl",
      args: [normalizeTerm(term.args[0]), normalizeTerm(term.args[1])]
    };
  }
  if (tag === "apply") {
    return {
      tag: "apply",
      op: normalizeTerm(term.op),
      args: term.args.map(normalizeTerm)
    };
  }
  if (tag === "op") {
    return {
      tag: "op",
      name: term.name,
      params: term.params,
      body: normalizeTerm(term.body)
    };
  }
  if (tag === "atom" || tag === "var") {
    return {tag, name: term.name};
  }
  // fallback
  const out = {};
  for (const k of Object.keys(term)) {
    out[k] = normalizeTerm(term[k]);
  }
  return out;
}

/* ---------- Term pretty-printing ---------- */

function termToString(term) {
  if (!term || typeof term !== "object") return String(term);
  switch (term.tag) {
    case "atom":  return term.name;
    case "proto": return "proto(" + termToString(term.arg) + ")";
    case "box":   return "box(" + termToString(term.arg) + ")";
    case "trace": return "trace(" + termToString(term.arg) + ")";
    case "impl":  return "(" + termToString(term.args[0]) + ") -> (" + termToString(term.args[1]) + ")";
    case "and":   return term.args.map(termToString).join(" & ");
    default:      return JSON.stringify(term);
  }
}

/* ---------- DSL Parser (similar to Python version, simplified) ---------- */

function stripOuterParensStr(s) {
  s = s.trim();
  if (!s.startsWith("(")) return s;
  let depth = 0;
  let end = -1;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === "(") depth++;
    else if (ch === ")") {
      depth--;
      if (depth === 0) {
        end = i;
        break;
      }
    }
  }
  if (end === s.length - 1) {
    return s.slice(1, -1).trim();
  }
  return s;
}

function findTopLevelStr(s, needle) {
  let depth = 0;
  for (let i = 0; i <= s.length - needle.length; i++) {
    const ch = s[i];
    if (ch === "(") depth++;
    else if (ch === ")") depth--;
    if (depth === 0 && s.slice(i, i + needle.length) === needle) {
      return i;
    }
  }
  return -1;
}

function splitTopLevelStr(s, sepChar) {
  const parts = [];
  let depth = 0;
  let start = 0;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === "(") depth++;
    else if (ch === ")") depth--;
    else if (depth === 0 && ch === sepChar) {
      parts.push(s.slice(start, i).trim());
      start = i + 1;
    }
  }
  parts.push(s.slice(start).trim());
  return parts.filter(x => x.length > 0);
}

function parseAtomic(s) {
  return {tag:"atom", name:s.trim()};
}

function parsePrefixOpStr(s, op) {
  s = s.trim();
  if (s.startsWith(op + "(") && s.endsWith(")")) {
    const inner = s.slice(op.length + 1, -1);
    return {tag: op, arg: parseTermDSL(inner)};
  }
  if (s.startsWith(op + " ")) {
    const inner = s.slice(op.length + 1);
    return {tag: op, arg: parseTermDSL(inner)};
  }
  return parseAtomic(s);
}

function parseApplyOrAtomStr(s) {
  s = s.trim();
  let depth = 0;
  let parenIndex = -1;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === "(") {
      if (depth === 0) parenIndex = i;
      depth++;
    } else if (ch === ")") {
      depth--;
    }
  }
  if (parenIndex === -1 || !s.endsWith(")")) {
    return parseAtomic(s);
  }
  const name = s.slice(0, parenIndex).trim();
  const inner = s.slice(parenIndex + 1, -1).trim();
  if (!name) return parseAtomic(s);
  let args = [];
  if (inner.length > 0) {
    const argStrs = splitTopLevelStr(inner, ",");
    args = argStrs.map(parseTermDSL);
  }
  return {tag:"apply", op:{tag:"atom", name}, args};
}

function parseTermDSL(text) {
  let s = text.trim();
  if (!s) return {tag:"atom", name:""};

  // repeatedly strip outer parens
  let prev = null;
  while (prev !== s) {
    prev = s;
    s = stripOuterParensStr(s);
  }

  // implication at depth 0
  let idx = findTopLevelStr(s, "->");
  if (idx !== -1) {
    const left = s.slice(0, idx).trim();
    const right = s.slice(idx + 2).trim();
    return normalizeTerm({
      tag:"impl",
      args:[parseTermDSL(left), parseTermDSL(right)]
    });
  }

  // conjunction at depth 0
  let depth = 0;
  let ampIndex = -1;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === "(") depth++;
    else if (ch === ")") depth--;
    else if (depth === 0 && ch === "&") {
      ampIndex = i;
      break;
    }
  }
  if (ampIndex !== -1) {
    const left = s.slice(0, ampIndex).trim();
    const right = s.slice(ampIndex + 1).trim();
    return normalizeTerm({
      tag:"and",
      args:[parseTermDSL(left), parseTermDSL(right)]
    });
  }

  // prefix ops: proto, box, trace
  for (const op of ["proto", "box", "trace"]) {
    if (s.startsWith(op + " ") || s.startsWith(op + "(")) {
      return normalizeTerm(parsePrefixOpStr(s, op));
    }
  }

  // apply or atom
  return normalizeTerm(parseApplyOrAtomStr(s));
}

/* ---------- Semantic helpers ---------- */

function newSemantic(cell, term, tags=[]) {
  term = normalizeTerm(term);
  const key = canonicalTerm(term);
  for (const s of cell.semantic) {
    if (canonicalTerm(s.term) === key) {
      for (const t of tags) if (!s.tags.includes(t)) s.tags.push(t);
      return s.id;
    }
  }
  const id = cell.counter.next_id++;
  cell.semantic.push({id, term, tags:[...tags]});
  return id;
}

function addEntail(cell, from, to, reason) {
  for (const e of cell.entails) {
    if (e.from === from && e.to === to && e.reason === reason) return;
  }
  cell.entails.push({from, to, reason});
}

function getSemByTerm(cell, term) {
  const key = canonicalTerm(normalizeTerm(term));
  for (const s of cell.semantic) {
    if (canonicalTerm(s.term) === key) return s;
  }
  return null;
}

function isStable(cell, term) {
  const key = canonicalTerm(normalizeTerm(term));
  for (const s of cell.semantic) {
    if (canonicalTerm(s.term) === key && s.tags.includes("stable")) return true;
  }
  return false;
}

/* ---------- Semantic closure S_sem (simplified) ---------- */

function applySemanticClosure(cell) {
  let changed = false;
  const original = [...cell.semantic];

  function ensureTerm(t, reason, fromId, tags) {
    const id = newSemantic(cell, t, tags);
    if (id !== fromId) {
      addEntail(cell, fromId, id, "S_sem:" + reason);
      changed = true;
    }
    return id;
  }

  for (const s of original) {
    const sid = s.id;
    const t = normalizeTerm(s.term);
    const tag = t.tag;

    // proto(t) => t, box(t)
    if (tag === "proto") {
      ensureTerm(t.arg, "proto-unpack", sid, ["input"]);
      ensureTerm({tag:"box", arg:t.arg}, "proto->box", sid, []);
    }

    // and(...) => each conjunct; and(a, impl(a,b)) => b
    if (tag === "and") {
      const args = t.args;

      for (const child of args) {
        ensureTerm(child, "and-elim", sid, []);
      }

      for (const child of args) {
        if (child.tag === "impl") {
          const a = child.args[0];
          const b = child.args[1];
          for (const other of args) {
            if (termsEqual(other, a)) {
              ensureTerm(b, "and-impl-elim", sid, []);
              break;
            }
          }
        }
      }
    }

    // impl(a,b) => box(impl(a,b)), impl(a,b) & a => b, if a,b stable -> impl(a,b) stable
    if (tag === "impl") {
      const a = t.args[0];
      const b = t.args[1];
      ensureTerm({tag:"box", arg:t}, "impl-modalize", sid, []);

      // modus ponens
      for (const s2 of original) {
        if (termsEqual(normalizeTerm(s2.term), normalizeTerm(a))) {
          ensureTerm(b, "modus-ponens", sid, []);
        }
      }

      // stability via stable premises & conclusion
      if (isStable(cell, a) && isStable(cell, b)) {
        ensureTerm(t, "impl-stable", sid, ["stable"]);
      }
    }

    // box(t) => t stable
    if (tag === "box") {
      ensureTerm(t.arg, "box-stabilize", sid, ["stable"]);
    }

    // trace(t) => box(trace(t)) -- minimal
    if (tag === "trace") {
      ensureTerm({tag:"box", arg:t}, "trace-box", sid, []);
    }
  }

  return changed;
}

function runClosure(cell, maxIter=20) {
  for (let i = 0; i < maxIter; i++) {
    if (!applySemanticClosure(cell)) break;
  }
  return cell;
}

/* ---------- Utility: get semantic IDs for a term ---------- */

function semanticIdsForTerm(cell, term) {
  const key = canonicalTerm(normalizeTerm(term));
  const ids = [];
  for (const s of cell.semantic) {
    if (canonicalTerm(s.term) === key) ids.push(s.id);
  }
  return ids;
}

/* ===========================================================
   SECTION 3: LM + EMBEDDINGS (BASE vs CHAT)
   =========================================================== */

/*
  We maintain two LMs:

  - LM_base: trained ONLY on semiotic corpus, derived from the datastore.
  - LM_chat: trained ONLY on chat corpus, derived from user/assistant messages.

  Each LM has:
    - bigram counts: counts[prevToken][nextToken]
    - word embeddings: emb[token] => vector

  We also use a self-attention-ish encoder to build sequence embeddings.

  Mode A (semiotic-only): use LM_base only.
  Mode B (hybrid): combine LM_base + LM_chat at sampling time.
*/

const EMB_DIM = 12;

function loadJSONLocal(key, fallback) {
  const raw = localStorage.getItem(key);
  if (!raw) {
    localStorage.setItem(key, JSON.stringify(fallback));
    return fallback;
  }
  return JSON.parse(raw);
}

function saveJSONLocal(key, obj) {
  localStorage.setItem(key, JSON.stringify(obj));
}

/* ---------- Tokenization ---------- */

function tokenize(text) {
  return text.trim().split(/[\s]+/).filter(Boolean);
}

/* ---------- LM structure ---------- */

function makeEmptyLM() {
  return {
    counts: {},        // counts[prev][next] => int
    embeddings: {},    // token -> vector
  };
}

function loadLMBase() {
  return loadJSONLocal("semiotic_lm_base_v011", makeEmptyLM());
}

function saveLMBase(lm) {
  saveJSONLocal("semiotic_lm_base_v011", lm);
}

function loadLMChat() {
  return loadJSONLocal("semiotic_lm_chat_v011", makeEmptyLM());
}

function saveLMChat(lm) {
  saveJSONLocal("semiotic_lm_chat_v011", lm);
}

/* ---------- Embeddings ---------- */

function randomVec(dim) {
  const v = [];
  for (let i = 0; i < dim; i++) {
    v.push((Math.random() * 2 - 1) * 0.1);
  }
  return v;
}

function dot(a, b) {
  let s = 0;
  for (let i = 0; i < a.length; i++) s += a[i] * b[i];
  return s;
}

function norm(a) {
  return Math.sqrt(dot(a, a)) || 1e-9;
}

function normalizeVec(a) {
  const n = norm(a);
  const out = [];
  for (let i = 0; i < a.length; i++) out.push(a[i] / n);
  return out;
}

function addScaled(a, b, scale) {
  const out = [];
  for (let i = 0; i < a.length; i++) out.push(a[i] + scale * b[i]);
  return out;
}

function getTokenEmbedding(lm, token) {
  if (!lm.embeddings[token]) {
    lm.embeddings[token] = randomVec(EMB_DIM);
  }
  return lm.embeddings[token];
}

function updateEmbeddingsLM(lm, tokens, lr=0.03) {
  if (tokens.length < 2) return;
  for (let i = 0; i < tokens.length - 1; i++) {
    const t1 = tokens[i], t2 = tokens[i+1];
    const e1 = getTokenEmbedding(lm, t1);
    const e2 = getTokenEmbedding(lm, t2);
    const e1_new = normalizeVec(addScaled(e1, e2, lr));
    const e2_new = normalizeVec(addScaled(e2, e1, lr));
    lm.embeddings[t1] = e1_new;
    lm.embeddings[t2] = e2_new;
  }
}

/* ---------- Self-attention-ish encoder ---------- */

function encodeTokensWithAttention(lm, tokens) {
  if (tokens.length === 0) return randomVec(EMB_DIM);
  const E = tokens.map(t => getTokenEmbedding(lm, t));
  const d = EMB_DIM;
  const scale = 1 / Math.sqrt(d);
  const context = [];

  for (let i = 0; i < E.length; i++) {
    const qi = E[i];
    const scores = [];
    for (let j = 0; j < E.length; j++) {
      const kj = E[j];
      scores.push(dot(qi, kj) * scale);
    }
    const expScores = scores.map(x => Math.exp(x));
    const sumExp = expScores.reduce((a,b) => a+b, 0) || 1;
    const alpha = expScores.map(x => x / sumExp);
    const ci = new Array(d).fill(0);
    for (let j = 0; j < E.length; j++) {
      for (let k = 0; k < d; k++) {
        ci[k] += alpha[j] * E[j][k];
      }
    }
    context.push(ci);
  }

  const mean = new Array(d).fill(0);
  for (const c of context) {
    for (let k = 0; k < d; k++) {
      mean[k] += c[k];
    }
  }
  for (let k = 0; k < d; k++) {
    mean[k] /= context.length;
  }
  return normalizeVec(mean);
}

function encodeTextWithAttention(lm, text) {
  const tokens = tokenize(text);
  return encodeTokensWithAttention(lm, tokens);
}

/* ---------- Bigram counts ---------- */

function updateCountsLM(lm, tokens) {
  const BOS = "<BOS>", EOS = "<EOS>";
  let prev = BOS;
  for (const tok of tokens) {
    if (!lm.counts[prev]) lm.counts[prev] = {};
    if (!lm.counts[prev][tok]) lm.counts[prev][tok] = 0;
    lm.counts[prev][tok] += 1;
    prev = tok;
  }
  if (!lm.counts[prev]) lm.counts[prev] = {};
  if (!lm.counts[prev][EOS]) lm.counts[prev][EOS] = 0;
  lm.counts[prev][EOS] += 1;
}

function sampleNextFromLM(lm, prev) {
  const row = lm.counts[prev];
  if (!row) return null;
  const entries = Object.entries(row);
  let total = 0;
  for (const [tok, count] of entries) total += count;
  let r = Math.random() * total;
  for (const [tok, count] of entries) {
    r -= count;
    if (r <= 0) return tok;
  }
  return entries[entries.length - 1][0];
}

/* ---------- Combined sampling: base-only vs hybrid ---------- */

function generateReplyFromLM(baseLM, chatLM, mode, maxTokens=40, seed=null) {
  const BOS = "<BOS>", EOS = "<EOS>";
  let prev = seed || BOS;
  const out = [];
  const alpha = (mode === "hybrid") ? 0.4 : 0.0; // how much chat LM influences

  for (let i = 0; i < maxTokens; i++) {
    const rowBase = baseLM.counts[prev] || {};
    const rowChat = chatLM.counts[prev] || {};
    const vocab = new Set([...Object.keys(rowBase), ...Object.keys(rowChat)]);
    if (vocab.size === 0) break;

    const scores = [];
    let total = 0;
    for (const tok of vocab) {
      const cb = rowBase[tok] || 0;
      const cc = rowChat[tok] || 0;
      const score = (1 - alpha) * cb + alpha * cc;
      if (score <= 0) continue;
      scores.push([tok, score]);
      total += score;
    }
    if (scores.length === 0) break;
    let r = Math.random() * total;
    let next = null;
    for (const [tok, sc] of scores) {
      r -= sc;
      if (r <= 0) {
        next = tok;
        break;
      }
    }
    if (!next || next === EOS) break;
    out.push(next);
    prev = next;
  }

  return out.join(" ");
}

/* ---------- Corpora ---------- */

function buildSemioticCorpus(cell) {
  // simple: for each semantic term, use canonical string
  const corpus = [];
  for (const s of cell.semantic) {
    const tStr = termToString(s.term);
    const toks = tokenize(tStr.toLowerCase());
    if (toks.length > 0) corpus.push(toks);
  }
  // plus entailment summaries
  for (const e of cell.entails) {
    const src = cell.semantic.find(x => x.id === e.from);
    const tgt = cell.semantic.find(x => x.id === e.to);
    if (!src || !tgt) continue;
    const seq = [
      "from", termToString(src.term).toLowerCase(),
      "to", termToString(tgt.term).toLowerCase()
    ];
    corpus.push(seq);
  }
  return corpus;
}

/* ===========================================================
   SECTION 4: SEMIOTIC-AWARE RESPONSE LOGIC
   =========================================================== */

let mode = "semiotic"; // "semiotic" or "hybrid"

function setMode(newMode) {
  mode = newMode;
  const modeStatus = document.getElementById("modeStatus");
  if (mode === "semiotic") {
    modeStatus.textContent = "Semiotic-only LM";
    modeStatus.style.background = "#2e7d32";
    modeStatus.style.color = "#f0f0f0";
  } else {
    modeStatus.textContent = "Hybrid (Semiotic + Chat)";
    modeStatus.style.background = "#1565c0";
    modeStatus.style.color = "#f0f0f0";
  }
}

/* ---------- LM training from semiotic datastore ---------- */

function retrainBaseLMFromCell(cell) {
  const lmBase = loadLMBase();
  lmBase.counts = {};
  lmBase.embeddings = {};
  const corpus = buildSemioticCorpus(cell);
  for (const seq of corpus) {
    updateCountsLM(lmBase, seq);
    updateEmbeddingsLM(lmBase, seq);
  }
  saveLMBase(lmBase);
}

function updateChatLMFromText(text) {
  const lmChat = loadLMChat();
  const tokens = tokenize(text.toLowerCase());
  updateCountsLM(lmChat, tokens);
  updateEmbeddingsLM(lmChat, tokens);
  saveLMChat(lmChat);
}

/* ---------- Semiotic retrieval ---------- */

function semioticRetrieveRelevant(cell, lm, userText, topK=5) {
  const msgTokens = tokenize(userText.toLowerCase());
  const msgVec = encodeTokensWithAttention(lm, msgTokens);
  const scored = [];
  for (const s of cell.semantic) {
    const termStr = termToString(s.term).toLowerCase();
    const tv = encodeTokensWithAttention(lm, tokenize(termStr));
    const sim = dot(msgVec, tv) / (norm(msgVec) * norm(tv) || 1e-9);
    scored.push({sem: s, sim});
  }
  scored.sort((a,b) => b.sim - a.sim);
  return scored.slice(0, topK).filter(x => x.sim > 0.15);
}

/* ---------- High-level response ---------- */

async function semioticChatRespond(userText) {
  const cell = loadCell();

  const trimmed = userText.trim();

  // --- Command: teach you X / learn that X => proto(X)
  let teachMatch = trimmed.match(/^(teach you|learn that)\s+(.+)$/i);
  if (teachMatch) {
    const content = teachMatch[2].trim();
    const term = parseTermDSL("proto(" + content + ")");
    newSemantic(cell, term, ["input"]);
    runClosure(cell);
    saveCell(cell);
    retrainBaseLMFromCell(cell);
    updateChatLMFromText(content); // chat LM sees language

    renderGraph(cell);
    return `Okay, I’ve stored that as a proto-recognition: ${content}`;
  }

  // --- Command: teach impl A -> B
  let teachImpl = trimmed.match(/^teach impl\s+(.+)$/i);
  if (teachImpl) {
    const content = teachImpl[1].trim();
    const implTerm = parseTermDSL(content);
    if (implTerm.tag === "impl") {
      const protoTerm = {tag:"proto", arg: implTerm};
      newSemantic(cell, protoTerm, ["input"]);
      runClosure(cell);
      saveCell(cell);
      retrainBaseLMFromCell(cell);
      updateChatLMFromText(content);

      renderGraph(cell);
      return `Got it. I’ve stored the implication: ${termToString(implTerm)}.`;
    } else {
      return `I expected something like "teach impl A -> B".`;
    }
  }

  // --- Command: what do you know about X
  const knowMatch = trimmed.match(/what do you know about (.+)/i);
  if (knowMatch) {
    const q = knowMatch[1].trim().toLowerCase();
    const results = [];
    for (const s of cell.semantic) {
      const txt = termToString(s.term).toLowerCase();
      if (txt.includes(q)) results.push(termToString(s.term));
    }
    if (results.length === 0) {
      return `I don't have anything about "${q}" yet. You can say 'teach you X' or 'teach impl A -> B'.`;
    } else {
      return "In my semiotic memory, I have:\n- " + results.slice(0, 40).join("\n- ");
    }
  }

  // --- Command: show memory
  if (/^show (my )?(memory|knowledge)$/i.test(trimmed)) {
    const lines = cell.semantic.map(s => termToString(s.term));
    if (lines.length === 0) return "My semiotic memory is empty so far.";
    return "Here is some of what I’ve stored:\n- " + lines.slice(0, 60).join("\n- ");
  }

  // --- Default: conversation
  updateChatLMFromText(trimmed);

  const lmBase = loadLMBase();
  const lmChat = loadLMChat();

  const relevant = semioticRetrieveRelevant(cell, lmBase, trimmed, 5);
  const relevantLines = relevant.map(x =>
    `• ${termToString(x.sem.term)}  (score ${x.sim.toFixed(2)})`
  );

  const toks = tokenize(trimmed.toLowerCase());
  const seed = toks.length > 0 ? toks[toks.length - 1] : null;
  const reply = generateReplyFromLM(lmBase, lmChat, mode, 40, seed) || "I'm still organizing my semiotic memory.";

  renderGraph(cell);

  if (relevantLines.length > 0) {
    return "Considering your message, I found these semantically close facts:\n" +
           relevantLines.join("\n") +
           "\n\nMy answer:\n" + reply;
  } else {
    return reply;
  }
}


/* ===========================================================
   SECTION 5: GRAPH VISUALIZATION (FORCE LAYOUT)
   =========================================================== */

const svg = document.getElementById("graphSvg");
const detailPanel = document.getElementById("detailPanel");

let graphNodes = [];
let graphLinks = [];
let graphNodeMap = new Map();
let animId = null;
let transformOffset = { x: 0, y: 0 };
let isPanning = false;
let lastPan = { x: 0, y: 0 };

function buildGraphFromCell(cell) {
  graphNodes = [];
  graphLinks = [];
  graphNodeMap.clear();

  for (const s of cell.semantic) {
    const t = s.term;
    const node = {
      id: s.id,
      term: t,
      tags: s.tags || [],
      x: Math.random() * 400,
      y: Math.random() * 300,
      vx: 0,
      vy: 0
    };
    graphNodes.push(node);
    graphNodeMap.set(s.id, node);
  }

  for (const e of cell.entails) {
    const src = graphNodeMap.get(e.from);
    const tgt = graphNodeMap.get(e.to);
    if (src && tgt) {
      graphLinks.push({ source: src, target: tgt, reason: e.reason });
    }
  }
}

function nodeColor(term, tags) {
  if (tags && tags.includes("stable")) return "#7b1fa2";
  switch (term.tag) {
    case "atom":  return "#1e88e5";
    case "proto": return "#f57c00";
    case "impl":  return "#e53935";
    case "and":   return "#43a047";
    case "box":   return "#7b1fa2";
    default:      return "#6d4c41";
  }
}

function nodeRadius(term, tags) {
  if (tags && tags.includes("stable")) return 10;
  switch (term.tag) {
    case "atom":  return 8;
    case "proto": return 7;
    case "impl":  return 9;
    case "and":   return 7;
    case "box":   return 8;
    default:      return 6;
  }
}

function renderGraph(cell) {
  buildGraphFromCell(cell);

  while (svg.firstChild) svg.removeChild(svg.firstChild);

  const w = svg.clientWidth || svg.parentElement.clientWidth || 400;
  const h = svg.clientHeight || svg.parentElement.clientHeight || 300;

  const linksG = document.createElementNS("http://www.w3.org/2000/svg", "g");
  const nodesG = document.createElementNS("http://www.w3.org/2000/svg", "g");
  linksG.setAttribute("id", "linksLayer");
  nodesG.setAttribute("id", "nodesLayer");
  svg.appendChild(linksG);
  svg.appendChild(nodesG);

  for (const link of graphLinks) {
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("class", "link");
    linksG.appendChild(line);
    link._elem = line;
  }

  for (const node of graphNodes) {
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "node");
    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("r", nodeRadius(node.term, node.tags));
    circle.setAttribute("fill", nodeColor(node.term, node.tags));

    const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    let labelStr = "";
    switch (node.term.tag) {
      case "atom":  labelStr = node.term.name; break;
      case "proto": labelStr = "proto"; break;
      case "impl":  labelStr = "→"; break;
      case "and":   labelStr = "&"; break;
      case "box":   labelStr = "□"; break;
      default:      labelStr = node.term.tag;
    }
    label.textContent = labelStr;
    label.setAttribute("font-size", "9px");
    label.setAttribute("fill", "#111");
    label.setAttribute("text-anchor", "middle");
    label.setAttribute("dy", "-0.9em");

    g.appendChild(circle);
    g.appendChild(label);
    g.__data__ = node;
    g.addEventListener("click", () => showNodeDetail(node, cell));

    nodesG.appendChild(g);
    node._elem = g;
  }

  svg.onmousedown = ev => {
    if (ev.target === svg) {
      isPanning = true;
      lastPan.x = ev.clientX;
      lastPan.y = ev.clientY;
    }
  };
  window.addEventListener("mousemove", ev => {
    if (isPanning) {
      const dx = ev.clientX - lastPan.x;
      const dy = ev.clientY - lastPan.y;
      transformOffset.x += dx;
      transformOffset.y += dy;
      lastPan.x = ev.clientX;
      lastPan.y = ev.clientY;
    }
  });
  window.addEventListener("mouseup", () => {
    isPanning = false;
  });

  if (animId !== null) cancelAnimationFrame(animId);
  function tick() {
    simulateForces(w, h);
    updateNodePositions();
    animId = requestAnimationFrame(tick);
  }
  tick();
}

function simulateForces(w, h) {
  const repulsion = 1800;
  const spring = 0.02;
  const damping = 0.88;
  const centerForce = 0.01;

  for (const n of graphNodes) {
    for (const m of graphNodes) {
      if (n === m) continue;
      let dx = n.x - m.x;
      let dy = n.y - m.y;
      let dist2 = dx*dx + dy*dy + 0.01;
      let force = repulsion / dist2;
      let dist = Math.sqrt(dist2);
      dx /= dist;
      dy /= dist;
      n.vx += dx * force;
      n.vy += dy * force;
    }
  }

  for (const l of graphLinks) {
    const n1 = l.source;
    const n2 = l.target;
    let dx = n2.x - n1.x;
    let dy = n2.y - n1.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 0.01;
    const desired = 90;
    const diff = dist - desired;
    dx /= dist;
    dy /= dist;
    const f = spring * diff;
    n1.vx += dx * f;
    n1.vy += dy * f;
    n2.vx -= dx * f;
    n2.vy -= dy * f;
  }

  const cx = w / 2, cy = h / 2;
  for (const n of graphNodes) {
    const dx = cx - n.x;
    const dy = cy - n.y;
    n.vx += dx * centerForce;
    n.vy += dy * centerForce;
    n.x += n.vx;
    n.y += n.vy;
    n.vx *= damping;
    n.vy *= damping;
  }
}

function updateNodePositions() {
  const linksLayer = svg.querySelector("#linksLayer");
  const nodesLayer = svg.querySelector("#nodesLayer");
  if (!linksLayer || !nodesLayer) return;

  for (const link of graphLinks) {
    const line = link._elem;
    if (!line) continue;
    line.setAttribute("x1", link.source.x + transformOffset.x);
    line.setAttribute("y1", link.source.y + transformOffset.y);
    line.setAttribute("x2", link.target.x + transformOffset.x);
    line.setAttribute("y2", link.target.y + transformOffset.y);
  }
  for (const node of graphNodes) {
    const g = node._elem;
    if (!g) continue;
    g.setAttribute("transform", `translate(${node.x + transformOffset.x}, ${node.y + transformOffset.y})`);
  }
}

function showNodeDetail(node, cell) {
  const s = cell.semantic.find(v => v.id === node.id);
  if (!s) {
    detailPanel.textContent = "Not found.";
    return;
  }
  const incoming = cell.entails.filter(e => e.to === s.id);
  const outgoing = cell.entails.filter(e => e.from === s.id);

  const lines = [];
  lines.push(`Node ID: ${s.id}`);
  lines.push(`Term: ${termToString(s.term)}`);
  lines.push(`Tags: ${s.tags.join(", ") || "(none)"}`);
  lines.push("");
  if (incoming.length > 0) {
    lines.push("Derived from:");
    for (const e of incoming) {
      const src = cell.semantic.find(v => v.id === e.from);
      lines.push(`  #${e.from} via ${e.reason}: ${src ? termToString(src.term) : "?"}`);
    }
  } else {
    lines.push("Derived from: (none)");
  }
  lines.push("");
  if (outgoing.length > 0) {
    lines.push("Entails:");
    for (const e of outgoing) {
      const tgt = cell.semantic.find(v => v.id === e.to);
      lines.push(`  #${e.to} via ${e.reason}: ${tgt ? termToString(tgt.term) : "?"}`);
    }
  } else {
    lines.push("Entails: (none)");
  }
  detailPanel.textContent = lines.join("\n");
}


/* ===========================================================
   SECTION 6: CHAT UI & INITIALIZATION
   =========================================================== */

const chatDiv = document.getElementById("chat");
const sendBtn = document.getElementById("sendBtn");
const inputBox = document.getElementById("inputBox");
const toggleModeBtn = document.getElementById("toggleModeBtn");
const btnShowMemory = document.getElementById("btnShowMemory");
const btnResetChat = document.getElementById("btnResetChat");
const btnResetAll = document.getElementById("btnResetAll");

function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chatDiv.appendChild(div);
  chatDiv.scrollTop = chatDiv.scrollHeight;
}

function addSystemMessage(text) {
  const div = document.createElement("div");
  div.className = "system";
  div.textContent = text;
  chatDiv.appendChild(div);
  chatDiv.scrollTop = chatDiv.scrollHeight;
}

function initGreeting() {
  addSystemMessage(
    "Welcome to Semiotic Chat v0.11.\n" +
    "\n" +
    "This is a fully local semiotic datastore + tiny LM:\n" +
    "• I store what you teach as structured terms.\n" +
    "• I run a small closure process over those terms.\n" +
    "• I train a base LM only on the semiotic datastore.\n" +
    "• I optionally train a chat LM on your conversation.\n" +
    "\nCommands to try:\n" +
    "  teach you cats are mammals\n" +
    "  teach impl cats are mammals -> they nurse their young\n" +
    "  what do you know about cats\n" +
    "  show memory\n" +
    "\nModes:\n" +
    "  Semiotic-only LM  = pure structure-first behavior\n" +
    "  Hybrid            = structure + chat-conditioned style\n" +
    "\nAll data lives in your browser localStorage and never leaves this machine."
  );
  const cell = loadCell();
  runClosure(cell);
  saveCell(cell);
  retrainBaseLMFromCell(cell);
  renderGraph(cell);
}

sendBtn.onclick = async function() {
  const text = inputBox.value.trim();
  if (!text) return;
  addMessage(text, "user");
  inputBox.value = "";

  const reply = await semioticChatRespond(text);
  addMessage(reply, "assistant");
};

inputBox.addEventListener("keyup", ev => {
  if (ev.key === "Enter") sendBtn.click();
});

toggleModeBtn.onclick = () => {
  setMode(mode === "semiotic" ? "hybrid" : "semiotic");
  addSystemMessage("Switched to mode: " + (mode === "semiotic" ? "Semiotic-only LM" : "Hybrid (Semiotic + Chat)"));
};

btnShowMemory.onclick = () => {
  const cell = loadCell();
  const lines = cell.semantic.map(s => termToString(s.term));
  if (lines.length === 0) {
    addSystemMessage("Semiotic memory is empty.");
  } else {
    addSystemMessage("Current semiotic memory (first 40 terms):\n- " + lines.slice(0, 40).join("\n- "));
  }
};

btnResetChat.onclick = () => {
  // clear chat LM only
  saveJSONLocal("semiotic_lm_chat_v011", makeEmptyLM());
  addSystemMessage("Chat LM has been reset. Semiotic LM remains intact.");
};

btnResetAll.onclick = () => {
  if (!confirm("Reset EVERYTHING, including the semiotic datastore and both LMs?")) return;
  saveCell(emptyCell());
  saveJSONLocal("semiotic_lm_base_v011", makeEmptyLM());
  saveJSONLocal("semiotic_lm_chat_v011", makeEmptyLM());
  addSystemMessage("All state has been reset. You are starting with a fresh semiotic universe.");
  const cell = loadCell();
  renderGraph(cell);
};

/* Initialize */
setMode("semiotic");
initGreeting();

</script>
