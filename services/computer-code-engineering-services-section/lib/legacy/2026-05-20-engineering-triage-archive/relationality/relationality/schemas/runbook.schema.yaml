            - sheafification
            - geometry_profile
            - observe
            - nucleate_profile
            - flow_profile
            - flow_laws_check
            - flow_measure_step
            - flow_measure_consistency_check
            - normalize_observation
            - stabilize_observation
            - fix_flow
            - fix_nucleus
            - fix_flow_nucleus
            - start_trace
            - advance_trace
            - stabilize_trace
            - trace_reentry
            - rehead_trace
            - retail_trace
            - restep_trace
            - trace_observation_equivalence
            - trace_observation_equivalence_closure
            - complete_trace
            - shuffle_trace
            - head_trace
            - tail_trace
            - trace_step
            - continue_trace
            - decompose_trace
            - trace_profile
            - close_judgment_trace
            - shuffle_equivalence_check
            - flow_nucleus_commutation
            - ergodicity
            - nucleus_laws_check
            - observation_kernel
            - fixed_kernel
            - evaluate_observation_equivalence
            - normalize_observation_equivalence
            - observation_equivalence_check
            - measured_observation_check
            - normalized_observation_check
            - stabilized_observation_check
            - measure_preservation
            - judgment_equivalence_check
            - equate_judgment_observation
            - trace_measurement_check
            - star_operation
            - profile_integral
            - modal_truncation
        step_index:
          type: integer
          minimum: 0
        inputs:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - role
              - kind
            properties:
              role:
                type: string
              kind:
                type: string
        outputs:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - role
              - kind
            properties:
              role:
                type: string
              kind:
                type: string
