            - substitution_term
            - evaluate_judgment
            - evaluate_observation
            - evaluation_equivalence
            - observation_equivalence
            - sheaf_profile_consistency
            - context_geometry
            - profile_observe
            - fixed_observe
            - reduce
            - recognize_syntax
            - normalize_syntax
            - spectral_geometry
            - mixing
            - measure_deviation_observation_kernel
