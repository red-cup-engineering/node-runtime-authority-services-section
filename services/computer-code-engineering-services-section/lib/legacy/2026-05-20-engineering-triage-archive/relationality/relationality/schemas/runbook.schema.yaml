$schema: "http://json-schema.org/draft-07/schema#"
title: Runbook
type: object
additionalProperties: false
required:
  - id
  - name
  - inputs
  - outputs
  - steps
properties:
  id:
    type: string
    pattern: "^[a-f0-9]{64}$"
  name:
    type: string
    enum:
      - presheaf_sheafify
      - build_evaluation_context
      - build_reducible_environment
      - profile_observe
      - profile_semantics_check
      - profile_dynamics_check
