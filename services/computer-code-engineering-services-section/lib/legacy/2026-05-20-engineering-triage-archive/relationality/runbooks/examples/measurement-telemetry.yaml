name: measurement-telemetry-example
description: >
  Demonstrate how flow-measure-step and emit-telemetry produce MeasurementEvents
  that can be ingested into the Measurement Fabric when channels are configured.
version: "1.0.0"
tags:
  - example
  - measurement
  - telemetry
policy_requirements: []

steps:
  - id: build_context
    name: Build parametric context
    description: Construct a base ParametricContext for physics/telemetry
    acts:
      - build-context
    depends_on: []
    inputs:
      - name: tenant
        type: string
        required: false
        default: null
      - name: domain
        type: string
        required: false
        default: physics
      - name: profile_id
        type: string
        required: false
        default: null
      - name: metadata
        type: any
        required: false
        default: {}
    outputs:
      - name: context
        type: any
      - name: fibre
        type: any
      - name: parametric_context
        type: any

  - id: init_state
    name: Initialize physics state
    description: Provide a minimal physics state to drive flow-measure-step
    acts:
      - physics-state
    depends_on:
      - build_context
    inputs:
      - name: recognition_ids
        type: any
        required: true
      - name: profile_id
        type: string
        required: false
        default: null
      - name: parametric_context
        type: any
        required: true
        from_step: build_context.parametric_context
    outputs:
      - name: state
        type: any

  - id: step_once
    name: Single flow-measure step
    description: Evolve the physics state and emit a measurement event
    acts:
      - flow-measure-step
    depends_on:
      - init_state
    inputs:
      - name: state
        type: any
        required: true
        from_step: init_state.state
      - name: parametric_context
        type: any
        required: true
        from_step: build_context.parametric_context
    outputs:
      - name: state
        type: any
      - name: step_info
        type: any
      - name: measurement
        type: any

  - id: emit_example_telemetry
    name: Emit example telemetry
    description: Emit a telemetry event that can be mirrored into the fabric
    acts:
      - emit-telemetry
    depends_on:
      - step_once
    inputs:
      - name: event_type
        type: string
        required: false
        default: physics-step
      - name: event_data
        type: any
        required: false
        default:
          message: "example physics step telemetry"
    outputs:
      - name: telemetry
        type: any
      - name: telemetry_id
        type: string

