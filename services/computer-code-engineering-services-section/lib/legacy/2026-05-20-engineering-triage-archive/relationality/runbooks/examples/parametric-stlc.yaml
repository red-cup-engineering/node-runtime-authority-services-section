name: parametric-stlc-example
description: >
  Example runbook combining build-context with judge-typing over a simple
  STLC term and typing context.
version: "1.0.0"
tags:
  - example
  - stlc
  - parametric
policy_requirements: []

steps:
  - id: build_context
    name: Build parametric context
    description: Construct a base ParametricContext for a tenant/domain
    acts:
      - build-context
    depends_on: []
    inputs:
      - name: tenant
        type: string
        required: false
        default: null
      - name: domain
        type: string
        required: false
        default: stlc
      - name: profile_id
        type: string
        required: false
        default: null
      - name: metadata
        type: any
        required: false
        default: {}
    outputs:
      - name: context
        type: any
      - name: fibre
        type: any
      - name: parametric_context
        type: any

  - id: seed_term_context
    name: Seed term and typing context
    description: Provide a simple lambda term and typing context
    acts:
      - seed-observation
    depends_on:
      - build_context
    inputs:
      - name: payload
        type: any
        required: true
        default:
          term:
            kind: lam
            var: x
            type:
              kind: atom
              name: A
            body:
              kind: var
              var: x
          context:
            - var: x
              type:
                kind: atom
                name: A
    outputs:
      - name: observation
        type: any

  - id: judge_typing
    name: Judge typing under parametric context
    description: Run judge-typing on the seeded term/context, under a context
    acts:
      - judge-typing
    depends_on:
      - build_context
      - seed_term_context
    inputs:
      - name: term
        type: any
        required: true
        from_step: seed_term_context.observation.payload.term
      - name: context
        type: any
        required: true
        from_step: seed_term_context.observation.payload.context
      - name: parametric_context
        type: any
        required: false
        from_step: build_context.parametric_context
    outputs:
      - name: judgement
        type: any
      - name: type
        type: any
      - name: ok
        type: boolean
      - name: errors
        type: any

