name: markov-dynamics-example
description: >
  Realise a small Markov dynamics simulation: build an observation kernel,
  approximate its stationary distribution, compute entropy, and check mixing.
version: "1.0.0"
tags:
  - example
  - markov
  - kernel
  - entropy
  - mixing
policy_requirements: []

steps:
  - id: build_kernel
    name: Build observation kernel
    description: Build a simple observation kernel over two states
    acts:
      - observation-kernel
    depends_on: []
    inputs:
      - name: states
        type: any
        required: true
        default:
          - id: "s0"
          - id: "s1"
      - name: transition_law
        type: any
        required: true
        default:
          s0:
            s0: 0.9
            s1: 0.1
          s1:
            s0: 0.2
            s1: 0.8
    outputs:
      - name: kernel
        type: any
      - name: kernel_id
        type: string

  - id: compute_fixed_kernel
    name: Compute stationary distribution
    description: Approximate the stationary distribution of the kernel
    acts:
      - fixed-kernel
    depends_on:
      - build_kernel
    inputs:
      - name: kernel
        type: any
        required: true
        from_step: build_kernel.kernel
      - name: max_steps
        type: number
        required: false
        default: 64
      - name: tolerance
        type: number
        required: false
        default: 1e-6
    outputs:
      - name: fixed_kernel
        type: any
      - name: stationary_distribution
        type: any

  - id: entropy_final
    name: Compute entropy of stationary distribution
    description: Use the entropy act to compute H(pi)
    acts:
      - entropy
    depends_on:
      - compute_fixed_kernel
    inputs:
      - name: distribution
        type: any
        required: true
        from_step: compute_fixed_kernel.stationary_distribution
    outputs:
      - name: entropy
        type: any
      - name: entropy_id
        type: string
      - name: value
        type: any

  - id: mixing_check
    name: Mixing diagnostics over history
    description: Use the mixing act over the distribution history from fixed-kernel
    acts:
      - mixing
    depends_on:
      - compute_fixed_kernel
    inputs:
      - name: history
        type: any
        required: true
        from_step: compute_fixed_kernel.fixed_kernel.history
      - name: threshold
        type: number
        required: false
        default: 1e-3
    outputs:
      - name: mixing
        type: any
      - name: mixed
        type: boolean
      - name: distance_first_last
        type: any
      - name: max_consecutive_distance
        type: any

  - id: detailed_balance_check
    name: Detailed balance diagnostics
    description: Check detailed balance π_i K_ij ≈ π_j K_ji for the kernel and stationary distribution
    acts:
      - detailed-balance
    depends_on:
      - build_kernel
      - compute_fixed_kernel
    inputs:
      - name: stationary_distribution
        type: any
        required: true
        from_step: compute_fixed_kernel.stationary_distribution
      - name: transition_law
        type: any
        required: true
        from_step: build_kernel.kernel.transition_law
      - name: tolerance
        type: number
        required: false
        default: 1e-6
    outputs:
      - name: detailed_balance
        type: any
      - name: balanced
        type: boolean
      - name: max_residual
        type: any
