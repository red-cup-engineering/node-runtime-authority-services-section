# Validate and Store Runbook
#
# This runbook demonstrates the full intake-to-storage flow:
# 1. Seed the observation
# 2. Validate syntax
# 3. Normalize for storage
#
# It traces back to the intake-stack and storage specifications.
#
# Usage:
#   POST /runbooks/{id}/execute
#   Body: {"payload": {"title": "Test", "content": {"key": "value"}}}

name: Validate and Store
description: >
  Full intake-to-storage flow that seeds an observation, validates its syntax,
  and normalizes it for storage. Demonstrates the complete intake stack.
version: "1.0.0"
tags:
  - intake
  - validation
  - storage
  - example
policy_requirements:
  - intake-policy
  - storage-policy

steps:
  - id: seed
    name: Seed Observation
    description: Create the initial observation from the payload
    acts:
      - seed-observation
    inputs:
      - name: payload
        type: any
        required: true
    outputs:
      - name: observation_id
        type: string
      - name: observation
        type: object

  - id: validate
    name: Validate Syntax
    description: Validate the observation against schema requirements
    acts:
      - recognize-syntax
    depends_on:
      - seed
    inputs:
      - name: recognition
        from_step: seed.observation
    outputs:
      - name: is_valid
        type: boolean
      - name: errors
        type: array
      - name: validation_result
        type: object

  - id: normalize
    name: Normalize for Storage
    description: Normalize the validated observation
    acts:
      - normalize-strongly
    depends_on:
      - validate
    condition: is_valid == True
    inputs:
      - name: observation
        from_step: seed.observation
    outputs:
      - name: normalized
        type: object
        description: Storage-ready normalized observation
