# Intake Observation Runbook
#
# This runbook demonstrates the canonical intake flow for new observations.
# It traces back to the intake-stack specification and the following acts:
# - seed-observation: Seeds the initial observation
# - recognize-value: Recognizes the value from the observation
# - normalize-observation: Normalizes the observation for storage
#
# Usage:
#   Submit this runbook to /runbooks, then execute with:
#   POST /runbooks/{id}/execute
#   Body: {"payload": {"type": "measurement", "value": 42, "unit": "meters"}}

name: Intake Observation
description: >
  Canonical intake flow for new observations. Seeds, recognizes, and normalizes
  an incoming observation payload according to the intake-stack specification.
version: "1.0.0"
tags:
  - intake
  - observation
  - example
policy_requirements:
  - intake-policy

steps:
  - id: seed
    name: Seed Observation
    description: Create the initial observation from the raw payload
    acts:
      - seed-observation
    inputs:
      - name: payload
        type: any
        required: true
    outputs:
      - name: observation_id
        type: string
        description: The ID of the seeded observation
      - name: observation
        type: object
        description: The full observation object

  - id: recognize
    name: Recognize Value
    description: Extract and recognize the value from the observation
    acts:
      - recognize-value
    depends_on:
      - seed
    inputs:
      - name: observation_id
        from_step: seed.observation_id
      - name: value
        from_step: seed.observation
    outputs:
      - name: recognition_id
        type: string
      - name: recognition
        type: object

  - id: normalize
    name: Normalize Observation
    description: Normalize the observation for storage and downstream processing
    acts:
      - normalize-observation
    depends_on:
      - recognize
    inputs:
      - name: observation
        from_step: seed.observation
    outputs:
      - name: normalized
        type: object
        description: The normalized observation ready for storage
