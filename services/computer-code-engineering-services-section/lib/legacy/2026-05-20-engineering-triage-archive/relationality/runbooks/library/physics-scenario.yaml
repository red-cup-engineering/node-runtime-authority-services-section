name: physics-scenario-example
description: Minimal physics scenario runbook using physics-state and flow-measure-step.
version: "1.0.0"
tags:
  - example
  - physics
policy_requirements: []
steps:
  - id: build_context
    name: Build parametric context
    acts:
      - build-evaluation-context
    depends_on: []
    inputs:
      - name: tenant
        type: string
        required: false
        default: null
      - name: domain
        type: string
        required: false
        default: physics
      - name: profile_id
        type: string
        required: false
        default: null
      - name: metadata
        type: any
        required: false
        default: {}
    outputs:
      - name: context
        type: any
      - name: fibre
        type: any
      - name: parametric_context
        type: any

  - id: init_state
    name: Initialize physics state
    acts:
      - physics-state
    depends_on:
      - build_context
    inputs:
      - name: recognition_ids
        type: any
        required: true
      - name: profile_id
        type: string
        required: false
        default: null
      - name: parametric_context
        type: any
        required: true
        from_step: build_context.parametric_context
    outputs:
      - name: state
        type: any
  - id: step_once
    name: Single flow-measure step
    acts:
      - flow-measure-step
    depends_on:
      - init_state
    inputs:
      - name: state
        type: any
        required: true
        from_step: init_state.state
      - name: parametric_context
        type: any
        required: true
        from_step: build_context.parametric_context
    outputs:
      - name: state
        type: any
      - name: step_info
        type: any
      - name: measurement
        type: any
      - name: measurement_id
        type: string

  - id: seed_measurement_observation
    name: Seed measurement as observation
    acts:
      - seed-observation
    depends_on:
      - step_once
    inputs:
      - name: payload
        type: any
        required: true
        from_step: step_once.measurement
    outputs:
      - name: observation_id
        type: string
      - name: observation
        type: any

  - id: recognize_measurement
    name: Recognize measurement observation
    acts:
      - recognize-observation
    depends_on:
      - seed_measurement_observation
    inputs:
      - name: value
        type: any
        required: true
        from_step: step_once.measurement
      - name: observation_id
        type: string
        required: true
        from_step: seed_measurement_observation.observation_id
    outputs:
      - name: recognition_id
        type: string
      - name: recognition
        type: any
