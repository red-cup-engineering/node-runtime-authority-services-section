name: observable-flow-example
description: >
  Demonstrate how an observation flows through an evaluation context and how
  flow-observation and flow-observation-equivalence are recorded.
version: "1.0.0"
tags:
  - example
  - measurement
  - observable
policy_requirements: []

steps:
  - id: seed_left
    name: Seed left observation
    description: Seed the first observation with a simple payload
    acts:
      - seed-observation
    depends_on: []
    inputs:
      - name: payload
        type: any
        required: true
        default:
          value: 1
    outputs:
      - name: observation
        type: any

  - id: seed_right
    name: Seed right observation
    description: Seed the second observation with an equivalent payload
    acts:
      - seed-observation
    depends_on: []
    inputs:
      - name: payload
        type: any
        required: true
        default:
          value: 1
    outputs:
      - name: observation
        type: any

  - id: flow_left
    name: Flow left observation
    description: Record flow of the left observation through a context
    acts:
      - flow-observation
    depends_on:
      - seed_left
    inputs:
      - name: observation
        type: any
        required: true
        from_step: seed_left.observation
      - name: context
        type: any
        required: false
        default:
          kind: "evaluation"
    outputs:
      - name: observation
        type: any
      - name: flow
        type: any

  - id: flow_right
    name: Flow right observation
    description: Record flow of the right observation through the same context
    acts:
      - flow-observation
    depends_on:
      - seed_right
    inputs:
      - name: observation
        type: any
        required: true
        from_step: seed_right.observation
      - name: context
        type: any
        required: false
        default:
          kind: "evaluation"
    outputs:
      - name: observation
        type: any
      - name: flow
        type: any

  - id: record_equivalence
    name: Record flow observation equivalence
    description: Record that the flowed observations remain equivalent
    acts:
      - flow-observation-equivalence
    depends_on:
      - flow_left
      - flow_right
    inputs:
      - name: left_observation
        type: any
        required: true
        from_step: flow_left.observation
      - name: right_observation
        type: any
        required: true
        from_step: flow_right.observation
      - name: context
        type: any
        required: false
        default:
          kind: "evaluation"
    outputs:
      - name: equivalence
        type: any

