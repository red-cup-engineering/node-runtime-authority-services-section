name: profile-kernel-topology-example
description: >
  Build a profile tower, attach an observation kernel to a specific tower level
  via profile-kernel-step, and obtain a topology-aware tower state.
version: "1.0.0"
tags:
  - example
  - topology
  - tower
  - kernel
policy_requirements: []

steps:
  - id: build_profile_tower
    name: Build profile tower
    description: Build a simple profile tower of height 2
    acts:
      - build-profile-tower
    depends_on: []
    inputs:
      - name: base_profile
        type: any
        required: true
        default:
          id: "base-profile"
          description: "Base profile for topology example"
      - name: height
        type: number
        required: true
        default: 2
      - name: metadata
        type: any
        required: false
        default:
          domain: "physics"
    outputs:
      - name: tower
        type: any

  - id: build_kernel
    name: Build observation kernel
    description: Build a simple observation kernel over two states
    acts:
      - observation-kernel
    depends_on: []
    inputs:
      - name: states
        type: any
        required: true
        default:
          - id: "s0"
          - id: "s1"
      - name: transition_law
        type: any
        required: true
        default:
          s0:
            s0: 0.9
            s1: 0.1
          s1:
            s0: 0.2
            s1: 0.8
    outputs:
      - name: kernel
        type: any
      - name: kernel_id
        type: string

  - id: apply_profile_kernel_step
    name: Apply profile kernel step
    description: Attach the observation kernel to the top level of the tower
    acts:
      - profile-kernel-step
    depends_on:
      - build_profile_tower
      - build_kernel
    inputs:
      - name: tower
        type: any
        required: true
        from_step: build_profile_tower.tower
      - name: level
        type: number
        required: true
        default: 1
      - name: kernel
        type: any
        required: true
        from_step: build_kernel.kernel
    outputs:
      - name: tower
        type: any
      - name: profile_kernel_step
        type: any

