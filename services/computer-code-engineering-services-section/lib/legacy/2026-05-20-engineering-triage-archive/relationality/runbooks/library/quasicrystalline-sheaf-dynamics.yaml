name: quasicrystalline-sheaf-dynamics
description: >
  Build a minimal sheaf section (tower over one fibre), apply a simple
  Markov/measurement dynamic to the tower via profile-kernel acts, and
  persist the resulting dynamic state as an observation.
version: "1.0.0"
tags:
  - example
  - hypertensor-sheaf
  - tower
  - dynamics
policy_requirements: []

steps:
  - id: build_profile_tower
    name: Build profile tower
    description: Build a simple profile tower of height 3
    acts:
      - build-profile-tower
    depends_on: []
    inputs:
      - name: base_profile
        type: any
        required: true
        default:
          id: "sheaf-dynamics-base-profile"
          description: "Base profile for sheaf dynamics example"
      - name: height
        type: number
        required: true
        default: 3
    outputs:
      - name: tower
        type: any
      - name: tower_id
        type: string
      - name: sheaf_section
        type: any

  - id: build_kernel
    name: Build observation kernel
    description: Build a simple observation kernel over two states
    acts:
      - observation-kernel
    depends_on: []
    inputs:
      - name: states
        type: any
        required: true
        default:
          - id: "s0"
          - id: "s1"
      - name: transition_law
        type: any
        required: true
        default:
          s0:
            s0: 0.9
            s1: 0.1
          s1:
            s0: 0.2
            s1: 0.8
    outputs:
      - name: kernel
        type: any
      - name: kernel_id
        type: string

  - id: apply_profile_kernel_step
    name: Apply profile kernel step
    description: Attach the observation kernel to level 1 of the tower
    acts:
      - profile-kernel-step
    depends_on:
      - build_profile_tower
      - build_kernel
    inputs:
      - name: tower
        type: any
        required: true
        from_step: build_profile_tower.tower
      - name: level
        type: number
        required: true
        default: 1
      - name: kernel
        type: any
        required: true
        from_step: build_kernel.kernel
    outputs:
      - name: tower
        type: any

  - id: build_profile_kernel_chain
    name: Build profile kernel chain
    description: Summarise kernel witnesses across tower levels
    acts:
      - profile-kernel-chain
    depends_on:
      - apply_profile_kernel_step
    inputs:
      - name: tower
        type: any
        required: true
        from_step: apply_profile_kernel_step.tower
      - name: kernel
        type: any
        required: true
        from_step: build_kernel.kernel
    outputs:
      - name: chain
        type: any
      - name: profile_kernel_chain
        type: any

  - id: compute_fixed_chain
    name: Compute fixed profile kernel chain
    description: Mark the profile kernel chain as fixed/stationary
    acts:
      - fixed-chain
    depends_on:
      - build_profile_kernel_chain
    inputs:
      - name: chain
        type: any
        required: true
        from_step: build_profile_kernel_chain.profile_kernel_chain
    outputs:
      - name: fixed_chain
        type: any

  - id: seed_section_dynamics
    name: Seed sheaf section dynamics state
    description: >
      Persist the dynamic state: minimal sheaf section plus its associated
      kernel chain and fixed chain, as an observation TracePoint.
    acts:
      - seed-observation
    depends_on:
      - build_profile_tower
      - build_profile_kernel_chain
      - compute_fixed_chain
    inputs:
      - name: payload
        type: any
        required: true
        default: {}
    outputs:
      - name: observation_id
        type: string
      - name: observation
        type: any
