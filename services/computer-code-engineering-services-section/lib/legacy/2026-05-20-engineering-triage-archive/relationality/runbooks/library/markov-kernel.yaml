name: markov-kernel-example
description: >
  Build an observation kernel from a simple transition law and approximate its
  stationary distribution using fixed-kernel.
version: "1.0.0"
tags:
  - example
  - markov
  - kernel
policy_requirements: []

steps:
  - id: seed_states
    name: Seed invariant states
    description: Seed a small set of fixed invariant states as recognitions
    acts:
      - seed-observation
    depends_on: []
    inputs:
      - name: payload
        type: any
        required: true
        default:
          state_id: "s0"
    outputs:
      - name: observation
        type: any

  - id: build_kernel
    name: Build observation kernel
    description: Build a simple observation kernel over two states
    acts:
      - observation-kernel
    depends_on:
      - seed_states
    inputs:
      - name: states
        type: any
        required: true
        default:
          - id: "s0"
          - id: "s1"
      - name: transition_law
        type: any
        required: true
        default:
          s0:
            s0: 0.9
            s1: 0.1
          s1:
            s0: 0.2
            s1: 0.8
    outputs:
      - name: kernel
        type: any
      - name: kernel_id
        type: string

  - id: compute_fixed_kernel
    name: Compute stationary distribution
    description: Approximate the stationary distribution of the kernel
    acts:
      - fixed-kernel
    depends_on:
      - build_kernel
    inputs:
      - name: kernel
        type: any
        required: true
        from_step: build_kernel.kernel
      - name: max_steps
        type: number
        required: false
        default: 64
      - name: tolerance
        type: number
        required: false
        default: 1e-6
    outputs:
      - name: fixed_kernel
        type: any
      - name: stationary_distribution
        type: any

