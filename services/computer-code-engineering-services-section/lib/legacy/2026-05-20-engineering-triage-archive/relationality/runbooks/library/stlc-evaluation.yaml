name: stlc-evaluation-example
description: >
  Evaluate an STLC term embedded in an observation payload using the
  evaluate-observation act.
version: "1.0.0"
tags:
  - example
  - stlc
  - evaluation
policy_requirements: []

steps:
  - id: seed_observation
    name: Seed term observation
    description: Provide a simple STLC term as an observation payload
    acts:
      - seed-observation
    depends_on: []
    inputs:
      - name: payload
        type: any
        required: true
        default:
          term:
            kind: lam
            var: x
            type:
              kind: atom
              name: A
            body:
              kind: var
              var: x
    outputs:
      - name: observation_id
        type: string
      - name: observation
        type: any

  - id: evaluate
    name: Evaluate observation term
    description: Run evaluate-observation on the seeded observation
    acts:
      - evaluate-observation
    depends_on:
      - seed_observation
    inputs:
      - name: observation
        type: any
        required: true
        from_step: seed_observation.observation
    outputs:
      - name: evaluation
        type: any
      - name: value
        type: any
      - name: steps
        type: any

