name: directed-space-example
description: >
  Example runbook demonstrating directed space acts:
  directed-transport, directed-equivalence, flow-nucleus,
  and commute-flow-and-nucleus.
version: "1.0.0"
tags:
  - example
  - directed-space
policy_requirements: []

steps:
  - id: seed_flow
    name: Seed flow configuration
    description: Provide a simple flow object and path for transport
    acts:
      - seed-observation
    depends_on: []
    inputs:
      - name: payload
        type: any
        required: true
        default:
          flow:
            id: "flow-0"
            field: "velocity"
            value: 1.0
          path:
            - "cell-0"
            - "cell-1"
            - "cell-2"
    outputs:
      - name: observation_id
        type: string
      - name: observation
        type: any

  - id: directed_transport
    name: Directed transport
    description: Transport a source along a path in directed space
    acts:
      - directed-transport
    depends_on:
      - seed_flow
    inputs:
      - name: source
        type: any
        required: true
        from_step: seed_flow.observation.payload.flow
      - name: path
        type: any
        required: true
        from_step: seed_flow.observation.payload.path
    outputs:
      - name: transport
        type: any
      - name: transport_id
        type: string

  - id: directed_equivalence
    name: Directed equivalence
    description: Check directed equivalence between two objects
    acts:
      - directed-equivalence
    depends_on:
      - seed_flow
      - directed_transport
    inputs:
      - name: left
        type: any
        required: true
        from_step: seed_flow.observation.payload.flow
      - name: right
        type: any
        required: true
        from_step: directed_transport.transport
    outputs:
      - name: equivalence
        type: any
      - name: equivalent
        type: boolean

  - id: flow_nucleus
    name: Flow nucleus
    description: Compute a flow nucleus for the transported flow
    acts:
      - flow-nucleus
    depends_on:
      - directed_transport
    inputs:
      - name: flow
        type: any
        required: true
        from_step: directed_transport.transport
      - name: nucleus_type
        type: string
        required: false
        default: standard
    outputs:
      - name: nucleus
        type: any
      - name: nucleus_id
        type: string

  - id: commute_flow_nucleus
    name: Commutation of flow and nucleus
    description: Witness commutation between flow and nucleus
    acts:
      - commute-flow-and-nucleus
    depends_on:
      - directed_transport
      - flow_nucleus
    inputs:
      - name: flow
        type: any
        required: true
        from_step: directed_transport.transport
      - name: nucleus
        type: any
        required: true
        from_step: flow_nucleus.nucleus
    outputs:
      - name: commutation
        type: any
      - name: commutes
        type: boolean

