name: judgement-evaluation-example
description: >
  Seed a judgement recognition, flow it conceptually, and evaluate the
  stabilised value using evaluate-judgement.
version: "1.0.0"
tags:
  - example
  - judgement
  - evaluation
policy_requirements: []

steps:
  - id: seed_judgement
    name: Seed judgement
    description: Seed a simple judgement recognition with a value
    acts:
      - seed-observation
    depends_on: []
    inputs:
      - name: payload
        type: any
        required: true
        default:
          judgement:
            value: true
    outputs:
      - name: observation
        type: any

  - id: recognize_judgement
    name: Recognize judgement
    description: Recognize the judgement value from the observation payload
    acts:
      - recognize-value
    depends_on:
      - seed_judgement
    inputs:
      - name: value
        type: any
        required: true
        from_step: seed_judgement.observation.payload.judgement.value
    outputs:
      - name: recognition
        type: any

  - id: evaluate_judgement
    name: Evaluate judgement
    description: Evaluate the flowed judgement as a stabilised value
    acts:
      - evaluate-judgement
    depends_on:
      - recognize_judgement
    inputs:
      - name: judgements
        type: any
        required: true
        from_step: recognize_judgement.recognition
    outputs:
      - name: evaluation
        type: any
      - name: values
        type: any

