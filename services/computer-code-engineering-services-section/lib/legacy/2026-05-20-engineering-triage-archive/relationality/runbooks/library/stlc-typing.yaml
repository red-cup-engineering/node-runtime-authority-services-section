name: stlc-typing-example
description: >
  Example runbook demonstrating judge-typing over a simple STLC term and
  typing context.
version: "1.0.0"
tags:
  - example
  - stlc
  - typing
policy_requirements: []

steps:
  - id: seed_term_context
    name: Seed term and typing context
    description: Provide a simple lambda term and typing context
    acts:
      - seed-observation
    depends_on: []
    inputs:
      - name: payload
        type: any
        required: true
        default:
          term:
            kind: lam
            var: x
            type:
              kind: atom
              name: A
            body:
              kind: var
              var: x
          context:
            - var: x
              type:
                kind: atom
                name: A
    outputs:
      - name: observation
        type: any

  - id: judge_typing
    name: Judge typing
    description: Run judge-typing on the seeded term/context
    acts:
      - judge-typing
    depends_on:
      - seed_term_context
    inputs:
      - name: term
        type: any
        required: true
        from_step: seed_term_context.observation.payload.term
      - name: context
        type: any
        required: true
        from_step: seed_term_context.observation.payload.context
    outputs:
      - name: judgement
        type: any
      - name: type
        type: any
      - name: ok
        type: boolean
      - name: errors
        type: any

