name: modalities-example
description: >
  Example runbook demonstrating box-modality and diamond-modality
  over a simple state graph and predicate vector.
version: "1.0.0"
tags:
  - example
  - modalities
policy_requirements: []

steps:
  - id: seed_graph
    name: Seed state graph and predicate
    description: Provide a small graph and base predicate assignment
    acts:
      - seed-observation
    depends_on: []
    inputs:
      - name: payload
        type: any
        required: true
        default:
          graph:
            nodes: ["s0", "s1", "s2"]
            edges:
              s0: ["s1", "s2"]
              s1: ["s2"]
              s2: []
          base:
            values:
              s0: false
              s1: true
              s2: false
    outputs:
      - name: observation_id
        type: string
      - name: observation
        type: any

  - id: box_evaluation
    name: Evaluate box modality
    description: Compute □P over the graph using box-modality
    acts:
      - box-modality
    depends_on:
      - seed_graph
    inputs:
      - name: graph
        type: any
        required: true
        from_step: seed_graph.observation.payload.graph
      - name: base
        type: any
        required: true
        from_step: seed_graph.observation.payload.base
    outputs:
      - name: evaluation
        type: any

  - id: diamond_evaluation
    name: Evaluate diamond modality
    description: Compute ◇P over the graph using diamond-modality
    acts:
      - diamond-modality
    depends_on:
      - seed_graph
    inputs:
      - name: graph
        type: any
        required: true
        from_step: seed_graph.observation.payload.graph
      - name: base
        type: any
        required: true
        from_step: seed_graph.observation.payload.base
    outputs:
      - name: evaluation
        type: any

