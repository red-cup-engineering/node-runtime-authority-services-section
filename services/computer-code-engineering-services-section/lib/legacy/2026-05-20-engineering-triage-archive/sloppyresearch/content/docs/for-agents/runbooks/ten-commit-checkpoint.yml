version: 1
name: ten-commit-checkpoint
description: Refresh graph, lint, update status/changelog/todo, dry-run publish
inputs:
  branch: ${GIT_BRANCH}
  commit: ${GIT_COMMIT}
policy:
  apply: false
  commit: true
steps:
- op: ingest
  args:
    branch: ${GIT_BRANCH}
    commit: ${GIT_COMMIT}
- op: lint
  args:
    paths:
    - research/papers/*.md
    - txt/scientific-texts/**/*.md
  outputs:
    report: docs/for-agents/reports/${DATE}-${SHORTSHA}-lint.json
- op: status
  args:
    out: docs/for-agents/log.agent-status.md
- op: changelog
  args:
    out: docs/for-agents/log.agent-changelog.md
    summary: ten-commit checkpoint (auto)
- op: todos
  args:
    out: docs/for-agents/log.agent-todo.md
    section: Next
    entries:
      - Implement publish pipeline (PDF + HTML) — Issue-A
      - Add relational context to publish outputs/manifests — Issue-J
      - Complete rrpr run automation (todos, commit policy) — Issue-B
- op: publish
  args:
    format:
    - pdf
    - html
    out_dir: dist/
  when: publish_enabled
outputs:
- docs/for-agents/reports/
- docs/for-agents/log.agent-status.md
- docs/for-agents/log.agent-changelog.md
- docs/for-agents/log.agent-todo.md
