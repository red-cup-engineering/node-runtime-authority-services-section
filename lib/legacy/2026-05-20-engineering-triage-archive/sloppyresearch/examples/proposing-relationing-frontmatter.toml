# Terms and concepts defined in this document
[[defines]]
term_id = "term.differentiation"
label = "Differentiation"
definition = "The primitive act of being; a minimal operation that distinguishes one region of possibility from another, creating a boundary and relational tension"

[[defines]]
term_id = "term.recognition"
label = "Recognition"
definition = "A region produced by an act of distinction; an object in the category 𝓡 whose morphisms are inclusions"

[[defines]]
term_id = "term.inclusion"
label = "Inclusion"
definition = "The relation Include(m₁, m₂) ⇔ m₁ ≤ m₂, measuring coherence between recognitions"

[[defines]]
term_id = "term.exclusion"
label = "Exclusion"
definition = "The relation Exclude(m₁, m₂) ⇔ pullback X₁ ×ᵧ X₂ ≅ ∅, measuring disjointness between recognitions"

[[defines]]
term_id = "term.induction"
label = "Induction"
definition = "Internal sufficiency operator Induce(a, b) = max {x | a ∧ x ≤ b}, determining when one recognition is sufficient for another"

[[defines]]
term_id = "term.iteration"
label = "Iteration"
definition = "Reflexive application of an operator to itself until stabilization; the testing of an operation against itself until stability appears"

[[defines]]
term_id = "term.closure"
label = "Closure"
definition = "An operator c: 𝒫(E) → 𝒫(E) satisfying A ⊆ c(A) and c(c(A)) = c(A); represents containment and completion"

[[defines]]
term_id = "term.interior"
label = "Interior"
definition = "The dual operator to closure, representing release and openness; together with closure forms balanced containment"

[[defines]]
term_id = "term.balance"
label = "Balance"
definition = "Reflexive equilibrium between closure (containment) and interior (release); the stable configuration of dual operators"

[[defines]]
term_id = "term.flow"
label = "Flow"
definition = "Lax-idempotent comonadic operator Flow(x) = Open(Close(x)) ∧ Close(Open(x)) satisfying deflationary and monotone properties"

[[defines]]
term_id = "term.relationing"
label = "Relationing"
definition = "A framework of logic, algebra, calculus, geometry, and physics derived from Lakota cosmogeny through the sequence: existence → differentiation → relation → reflexive stability"

[[defines]]
term_id = "term.relational-infinity-topos-modality"
label = "Relational ∞-Topos Modality"
definition = "RITM; the pattern of generation, fixation, and stabilization emerging from reflexion of relations within a category"

[[defines]]
term_id = "term.subobject-classifier"
label = "Subobject Classifier"
definition = "Object Ωᵧ and morphism ⊤ᵧ: 1 → Ωᵧ such that any monomorphism is uniquely determined by a characteristic map; the codomain of distinction and origin of truth values"

[[defines]]
term_id = "term.heyting-algebra"
label = "Heyting Algebra"
definition = "Structure (Sub(Y), ∧, ∨, Induce, ⊥, ⊤) where operators correspond to logical connectives: ∧ as conjunction, ∨ as disjunction, Induce as implication"

[[defines]]
term_id = "term.fixed-point"
label = "Fixed Point"
definition = "A recognition x stable under operator f such that f(x) = x; where self-application stabilizes, law begins"

[[defines]]
term_id = "term.reflexive-stability"
label = "Reflexive Stability"
definition = "The property of withstanding repetition; when an operation applied to itself yields no further change"

