$id: "https://relationality.local/schemas/runbook.schema.yaml"
title: "Runbook"
description: >-
  Morphic operator pipeline generated by acts. Runbooks are declarative, typed
  templates for operator application; they are not executable on their own.
type: object
required:
  - id
  - name
  - input_kind
  - output_kind
  - steps
properties:
  id:
    type: string
    pattern: "^[A-Za-z0-9_.:-]+$"
  name:
    type: string
  description:
    type: string
  input_kind:
    type: string
  output_kind:
    type: string
  acts:
    type: array
    items:
      type: string
  steps:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - operator
        - realizer
        - input_kind
        - output_kind
      properties:
        operator:
          type: string
          description: Act-level operator name (e.g., Observe, FlowProfile).
        realizer:
          type: string
          description: Identifier of the realizer metadata entry that implements this operator.
        description:
          type: string
        input_kind:
          type: string
        output_kind:
          type: string
        invariants:
          type: array
          items:
            type: string
        acts:
          type: array
          items:
            type: string
      additionalProperties: false
additionalProperties: false