id: canonical-system-interaction
name: Canonical System Interaction
description: >-
  Canonical interaction pipeline induced by the acts. External callers inject
  ObservationCarriers; the pipeline converges to a FixedInvariant via aperiodic
  Flow–Nucleus interaction.
input_kind: ObservationCarrier
output_kind: FixedInvariant
acts:
  - Observe
  - NucleateProfile
  - FlowProfile
  - FlowMeasureStep
  - NormalizeObservation
  - StabilizeObservation
  - FixFlowNucleus
steps:
  - operator: Observe
    realizer: observe
    description: Interpret external observation carrier under the MeasurementFrame.
    input_kind: ObservationCarrier
    output_kind: ObservationRecognition
    acts: ["Observe", "ProfileObserve"]
  - operator: NucleateProfile
    realizer: nucleate_profile
    description: Close observation within the profile nucleus (closure act).
    input_kind: ObservationRecognition
    output_kind: NucleatedProfile
    acts: ["NucleateProfile", "NucleusSemantics"]
  - operator: FlowProfile
    realizer: flow_profile
    description: Evolve the profile phase space under FlowProfile.
    input_kind: NucleatedProfile
    output_kind: PhaseSpace
    acts: ["FlowProfile", "ProfileDynamics"]
  - operator: FlowMeasureStep
    realizer: flow_measure_step
    description: Couple flow to measurement using FlowMeasureStep.
    input_kind: PhaseSpace
    output_kind: MeasurementOutcome
    acts: ["FlowMeasureStep", "ObservationKernel"]
  - operator: NormalizeObservation
    realizer: normalize_observation
    description: Normalize measurement into observational equivalence.
    input_kind: MeasurementOutcome
    output_kind: NormalizedObservation
    acts: ["NormalizeObservation", "ObservationEquivalence"]
  - operator: StabilizeObservation
    realizer: stabilize_observation
    description: Stabilize observation prior to fixed-point extraction.
    input_kind: NormalizedObservation
    output_kind: StabilizedObservation
    acts: ["StabilizeObservation", "TraceReentryClosure"]
  - operator: FixFlowNucleus
    realizer: fix_flow_nucleus
    description: Enforce aperiodic commutation and extract FixedInvariant.
    input_kind: StabilizedObservation
    output_kind: FixedInvariant
    acts: ["FixFlowNucleus", "FixedInvariant"]
