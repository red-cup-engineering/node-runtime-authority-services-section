name: stlc-traced-evaluation-example
description: >
  Start a trace, build a parametric context, seed an STLC term as an
  observation, type-check it, evaluate it, record the step in the trace,
  and complete the trace.
version: "1.0.0"
tags:
  - example
  - stlc
  - parametric
  - evaluation
  - trace
policy_requirements: []

steps:
  - id: start_trace
    name: Start trace
    description: Begin a new trace for this STLC evaluation
    acts:
      - start-trace
    depends_on: []
    inputs: []
    outputs:
      - name: trace
        type: any

  - id: build_context
    name: Build parametric context
    description: Construct a base ParametricContext for STLC evaluation
    acts:
      - build-context
    depends_on:
      - start_trace
    inputs:
      - name: tenant
        type: string
        required: false
        default: null
      - name: domain
        type: string
        required: false
        default: stlc
      - name: profile_id
        type: string
        required: false
        default: null
      - name: metadata
        type: any
        required: false
        default: {}
    outputs:
      - name: context
        type: any
      - name: fibre
        type: any
      - name: parametric_context
        type: any

  - id: seed_term_observation
    name: Seed term observation
    description: Provide a simple STLC term and typing context as observation payload
    acts:
      - seed-observation
    depends_on:
      - build_context
    inputs:
      - name: payload
        type: any
        required: true
        default:
          term:
            kind: lam
            var: x
            type:
              kind: atom
              name: A
            body:
              kind: var
              var: x
          context:
            - var: x
              type:
                kind: atom
                name: A
    outputs:
      - name: observation_id
        type: string
      - name: observation
        type: any

  - id: judge_typing
    name: Judge typing under parametric context
    description: Run judge-typing on the term/context from the observation
    acts:
      - judge-typing
    depends_on:
      - build_context
      - seed_term_observation
    inputs:
      - name: term
        type: any
        required: true
        from_step: seed_term_observation.observation.payload.term
      - name: context
        type: any
        required: true
        from_step: seed_term_observation.observation.payload.context
      - name: parametric_context
        type: any
        required: false
        from_step: build_context.parametric_context
    outputs:
      - name: judgement
        type: any
      - name: type
        type: any
      - name: ok
        type: boolean
      - name: errors
        type: any

  - id: evaluate
    name: Evaluate observation term
    description: Evaluate the STLC term embedded in the observation payload
    acts:
      - evaluate-observation
    depends_on:
      - seed_term_observation
    inputs:
      - name: observation
        type: any
        required: true
        from_step: seed_term_observation.observation
    outputs:
      - name: evaluation
        type: any
      - name: value
        type: any
      - name: steps
        type: any

  - id: trace_step
    name: Record evaluation step in trace
    description: Record the evaluation result as a trace step
    acts:
      - trace-step
    depends_on:
      - start_trace
      - evaluate
    inputs:
      - name: trace
        type: any
        required: true
        from_step: start_trace.trace
      - name: operation
        type: string
        required: false
        default: stlc-evaluation
      - name: payload
        type: any
        required: true
        from_step: evaluate.evaluation
    outputs:
      - name: trace
        type: any
      - name: step
        type: any

  - id: complete_trace
    name: Complete trace
    description: Finalize the trace with the evaluation result
    acts:
      - complete-trace
    depends_on:
      - trace_step
      - evaluate
    inputs:
      - name: trace
        type: any
        required: true
        from_step: trace_step.trace
      - name: result
        type: any
        required: true
        from_step: evaluate.evaluation
    outputs:
      - name: completion
        type: any

