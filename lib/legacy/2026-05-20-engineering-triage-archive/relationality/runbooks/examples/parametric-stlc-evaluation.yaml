name: parametric-stlc-evaluation-example
description: >
  Build a parametric context, seed an STLC term as an observation, type-check
  it, and evaluate it using judge-typing and evaluate-observation.
version: "1.0.0"
tags:
  - example
  - stlc
  - parametric
  - evaluation
policy_requirements: []

steps:
  - id: build_context
    name: Build parametric context
    description: Construct a base ParametricContext for a tenant/domain
    acts:
      - build-context
    depends_on: []
    inputs:
      - name: tenant
        type: string
        required: false
        default: null
      - name: domain
        type: string
        required: false
        default: stlc
      - name: profile_id
        type: string
        required: false
        default: null
      - name: metadata
        type: any
        required: false
        default: {}
    outputs:
      - name: context
        type: any
      - name: fibre
        type: any
      - name: parametric_context
        type: any

  - id: seed_term_observation
    name: Seed term observation
    description: Provide a simple STLC term and typing context as observation payload
    acts:
      - seed-observation
    depends_on:
      - build_context
    inputs:
      - name: payload
        type: any
        required: true
        default:
          term:
            kind: lam
            var: x
            type:
              kind: atom
              name: A
            body:
              kind: var
              var: x
          context:
            - var: x
              type:
                kind: atom
                name: A
    outputs:
      - name: observation_id
        type: string
      - name: observation
        type: any

  - id: judge_typing
    name: Judge typing under parametric context
    description: Run judge-typing on the term/context from the observation
    acts:
      - judge-typing
    depends_on:
      - build_context
      - seed_term_observation
    inputs:
      - name: term
        type: any
        required: true
        from_step: seed_term_observation.observation.payload.term
      - name: context
        type: any
        required: true
        from_step: seed_term_observation.observation.payload.context
      - name: parametric_context
        type: any
        required: false
        from_step: build_context.parametric_context
    outputs:
      - name: judgement
        type: any
      - name: type
        type: any
      - name: ok
        type: boolean
      - name: errors
        type: any

  - id: evaluate
    name: Evaluate observation term
    description: Evaluate the STLC term embedded in the observation payload
    acts:
      - evaluate-observation
    depends_on:
      - seed_term_observation
    inputs:
      - name: observation
        type: any
        required: true
        from_step: seed_term_observation.observation
    outputs:
      - name: evaluation
        type: any
      - name: value
        type: any
      - name: steps
        type: any

