name: knowledge-resource-upsert
description: >
  Upsert a knowledge resource into the internal knowledge graph
  by seeding an observation carrying a structured knowledge payload.
version: "1.0.0"
tags:
  - example
  - knowledge
  - rdf
policy_requirements: []

steps:
  - id: seed_knowledge_resource
    name: Seed knowledge resource
    description: >
      Create an observation whose payload represents a knowledge
      resource (concept, note, paper, or page).
    acts:
      - seed-observation
    depends_on: []
    inputs:
      - name: payload
        type: any
        required: true
        description: >
          Structured knowledge payload with fields like kind, title,
          summary, body, iri, tags, and sources.
    outputs:
      - name: observation_id
        type: string
      - name: observation
        type: object

