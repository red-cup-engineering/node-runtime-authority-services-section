name: ingest-text
description: >
  Ingest a raw text blob into the relational computer as a simple observation
  with a {kind: "text", text: "..."} payload.
version: "1.0.0"
tags:
  - example
  - text
  - ingestion
policy_requirements: []

steps:
  - id: ingest_text
    name: Ingest text as observation
    description: >
      Wrap the provided text into a minimal payload and seed it as an
      observation TracePoint.
    acts:
      - seed-observation
    depends_on: []
    inputs:
      - name: payload
        type: any
        required: true
        description: >
          A dict with at least {"kind": "text", "text": "..."}; callers
          construct this and pass it directly.
    outputs:
      - name: observation_id
        type: string
      - name: observation
        type: object

