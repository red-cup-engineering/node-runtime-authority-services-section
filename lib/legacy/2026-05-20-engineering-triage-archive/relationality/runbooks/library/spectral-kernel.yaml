name: spectral-kernel-example
description: >
  Extract a harmonic mode of a simple observation kernel and record its spectral seed.
version: "1.0.0"
tags:
  - example
  - spectral
  - kernel
policy_requirements: []

steps:
  - id: build_kernel
    name: Build observation kernel
    description: Build a simple observation kernel over two states
    acts:
      - observation-kernel
    depends_on: []
    inputs:
      - name: states
        type: any
        required: true
        default:
          - id: "s0"
          - id: "s1"
      - name: transition_law
        type: any
        required: true
        default:
          s0:
            s0: 0.9
            s1: 0.1
          s1:
            s0: 0.2
            s1: 0.8
    outputs:
      - name: kernel
        type: any
      - name: kernel_id
        type: string

  - id: compute_mode
    name: Approximate harmonic mode
    description: Approximate a harmonic mode of the kernel via power iteration
    acts:
      - harmonic-mode
    depends_on:
      - build_kernel
    inputs:
      - name: kernel
        type: any
        required: true
        from_step: build_kernel.kernel
      - name: max_steps
        type: number
        required: false
        default: 64
      - name: tolerance
        type: number
        required: false
        default: 1e-6
    outputs:
      - name: mode
        type: any
      - name: eigenvalue
        type: any
      - name: harmonic_mode
        type: any

  - id: spectrum_seed
    name: Spectrum seed K * mode
    description: Record how the kernel acts on the harmonic mode
    acts:
      - spectrum-seed
    depends_on:
      - build_kernel
      - compute_mode
    inputs:
      - name: kernel
        type: any
        required: true
        from_step: build_kernel.kernel
      - name: mode
        type: any
        required: true
        from_step: compute_mode.mode
    outputs:
      - name: spectrum_seed
        type: any
      - name: image
        type: any

