name: topology-integration-example
description: >
  Integrate profile towers and simple sheaf/locality data into a constraint
  bundle using topology integration acts.
version: "1.0.0"
tags:
  - example
  - topology
  - tower
  - sheaf
  - constraints
policy_requirements: []

steps:
  - id: build_profile_tower
    name: Build profile tower
    description: Build a simple profile tower of height 3
    acts:
      - build-profile-tower
    depends_on: []
    inputs:
      - name: base_profile
        type: any
        required: true
        default:
          id: "base-profile"
          description: "Base profile for topology integration example"
      - name: height
        type: number
        required: true
        default: 3
      - name: metadata
        type: any
        required: false
        default:
          domain: "physics"
    outputs:
      - name: tower
        type: any

  - id: build_strata
    name: Build strata entries
    description: Build strata entries for a few modules along the tower
    acts:
      - stratum-entry
    depends_on:
      - build_profile_tower
    inputs:
      - name: entries
        type: any
        required: true
        default:
          - module_id: "runtime"
            tower_level: 0
            coverage:
              region: "core"
          - module_id: "storage-service"
            tower_level: 1
            coverage:
              region: "core"
          - module_id: "markov-analytics"
            tower_level: 2
            coverage:
              region: "analytics"
    outputs:
      - name: strata
        type: any
      - name: strata_count
        type: number

  - id: build_sheaf_fiber
    name: Build simple sheaf fiber
    description: Record a simple glued section for locality illustration
    acts:
      - sheaf-fiber
    depends_on: []
    inputs:
      - name: object_id
        type: string
        required: true
        default: "dataset-Z"
      - name: cover_id
        type: string
        required: true
        default: "cover-core"
      - name: section_data
        type: any
        required: false
        default:
          region: "core"
          notes: "Core-data cover section"
    outputs:
      - name: fiber
        type: any

  - id: synthesize_constraints
    name: Synthesize topology constraints
    description: Synthesize ordering and locality constraints from strata
    acts:
      - synthesize-constraints
    depends_on:
      - build_strata
    inputs:
      - name: strata
        type: any
        required: true
        from_step: build_strata.strata
    outputs:
      - name: constraints
        type: any

