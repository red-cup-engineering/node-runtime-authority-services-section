name: traceability-view-example
description: >
  Build a traceability view for a single TracePoint/recognition, including its
  content, dependency edges, and audit logs.
version: "1.0.0"
tags:
  - example
  - traceability
policy_requirements: []

steps:
  - id: view_tracepoint
    name: View tracepoint traceability
    description: Construct a traceability view for the given TracePoint id
    acts:
      - traceability-view
    depends_on: []
    inputs:
      - name: tracepoint_id
        type: string
        required: true
    outputs:
      - name: view
        type: any

