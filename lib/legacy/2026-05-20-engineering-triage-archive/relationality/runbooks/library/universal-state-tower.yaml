name: universal-state-tower
description: >
  Build and persist a simple profile tower as a slice of the universal
  relational state, using the existing build-profile-tower act.
version: "1.0.0"
tags:
  - example
  - universal-state
  - tower
policy_requirements: []

steps:
  - id: build_profile_tower
    name: Build profile tower
    description: Build a simple profile tower of height 3
    acts:
      - build-profile-tower
    depends_on: []
    inputs:
      - name: base_profile
        type: any
        required: true
        default:
          id: base-profile
          description: Base profile for universal-state tower example
      - name: height
        type: number
        required: true
        default: 3
    outputs:
      - name: tower
        type: any
      - name: tower_id
        type: string

