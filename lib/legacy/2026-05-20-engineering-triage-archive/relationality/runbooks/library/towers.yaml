name: towers-example
description: >
  Example runbook demonstrating profile tower acts:
  build-profile-tower, build-nested-profile-tower,
  build-composite-profile-tower, and calculate-profile-syntax.
version: "1.0.0"
tags:
  - example
  - towers
policy_requirements: []

steps:
  - id: seed_base_profile
    name: Seed base profile
    description: Provide a simple base profile payload
    acts:
      - seed-observation
    depends_on: []
    inputs:
      - name: payload
        type: any
        required: true
        default:
          id: "profile-0"
          domain: "test"
          attributes:
            key: "value"
    outputs:
      - name: observation_id
        type: string
      - name: observation
        type: any

  - id: build_tower
    name: Build profile tower
    description: Build a simple profile tower from the base profile
    acts:
      - build-profile-tower
    depends_on:
      - seed_base_profile
    inputs:
      - name: base_profile
        type: any
        required: true
        from_step: seed_base_profile.observation.payload
      - name: height
        type: number
        required: false
        default: 3
    outputs:
      - name: tower
        type: any
      - name: tower_id
        type: string
      - name: height
        type: number

  - id: build_nested_tower
    name: Build nested profile tower
    description: Nest a profile inside the existing tower
    acts:
      - build-nested-profile-tower
    depends_on:
      - build_tower
    inputs:
      - name: outer_tower
        type: any
        required: true
        from_step: build_tower.tower
      - name: inner_profile
        type: any
        required: false
        default:
          id: "profile-inner"
          domain: "test"
      - name: nesting_level
        type: number
        required: false
        default: 1
    outputs:
      - name: nested_tower
        type: any
      - name: nested_tower_id
        type: string

  - id: build_composite_tower
    name: Build composite profile tower
    description: Compose towers into a composite profile tower
    acts:
      - build-composite-profile-tower
    depends_on:
      - build_tower
      - build_nested_tower
    inputs:
      - name: towers
        type: any
        required: true
        default: []
      - name: composition_type
        type: string
        required: false
        default: sequential
    outputs:
      - name: composite_tower
        type: any
      - name: composite_tower_id
        type: string

  - id: calculate_syntax
    name: Calculate profile syntax
    description: Calculate syntax for the base tower
    acts:
      - calculate-profile-syntax
    depends_on:
      - build_tower
    inputs:
      - name: tower
        type: any
        required: true
        from_step: build_tower.tower
    outputs:
      - name: syntax
        type: any

