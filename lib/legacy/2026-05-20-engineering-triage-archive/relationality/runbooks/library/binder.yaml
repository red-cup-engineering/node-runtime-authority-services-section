name: binder-example
description: >
  Example runbook demonstrating binder acts:
  binder-seed, binder-application, binder-transport, and bind-term.
version: "1.0.0"
tags:
  - example
  - binder
policy_requirements: []

steps:
  - id: seed_binder
    name: Seed binder
    description: Seed a binder for a variable and its type
    acts:
      - binder-seed
    depends_on: []
    inputs:
      - name: variable
        type: string
        required: true
        default: x
      - name: type
        type: string
        required: false
        default: number
    outputs:
      - name: binder
        type: any
      - name: binder_id
        type: string

  - id: apply_binder
    name: Apply binder to argument
    description: Apply the seeded binder to an argument value
    acts:
      - binder-application
    depends_on:
      - seed_binder
    inputs:
      - name: binder
        type: any
        required: true
        from_step: seed_binder.binder
      - name: argument
        type: any
        required: true
        default: 42
    outputs:
      - name: application
        type: any
      - name: result
        type: any

  - id: transport_binder
    name: Transport binder
    description: Transport the binder to a destination context
    acts:
      - binder-transport
    depends_on:
      - seed_binder
    inputs:
      - name: binder
        type: any
        required: true
        from_step: seed_binder.binder
      - name: destination
        type: string
        required: false
        default: module-A
    outputs:
      - name: transport
        type: any
      - name: transported_binder
        type: any

  - id: bind_term
    name: Bind term
    description: Bind the variable in a term to a value
    acts:
      - bind-term
    depends_on:
      - seed_binder
      - apply_binder
    inputs:
      - name: term
        type: any
        required: true
        default:
          op: add
          args:
            - x
            - 1
      - name: variable
        type: string
        required: true
        from_step: seed_binder.binder.variable
      - name: value
        type: any
        required: true
        from_step: apply_binder.result
    outputs:
      - name: binding
        type: any
      - name: bound_term
        type: any

