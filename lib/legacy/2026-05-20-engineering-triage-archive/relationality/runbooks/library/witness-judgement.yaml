# Witness Judgement Runbook
#
# This runbook demonstrates the witnessing flow for creating judgements.
# It traces back to the foundational witness calculus and the following acts:
# - start-trace: Begins a new trace for the judgement
# - witness-judgement: Creates the witness for the judgement
# - trace-step: Records the step in the trace
# - complete-trace: Finalizes the trace
#
# Usage:
#   Submit this runbook to /runbooks, then execute with:
#   POST /runbooks/{id}/execute
#   Body: {"target_id": "<recognition-uuid>", "judgement_type": "validation"}

name: Witness Judgement
description: >
  Creates a witnessed judgement on a target recognition, recording the full
  trace of the witnessing act as required by the judgement witness calculus.
version: "1.0.0"
tags:
  - witness
  - judgement
  - trace
  - example
policy_requirements: []

steps:
  - id: start
    name: Start Trace
    description: Begin a new trace for this witnessing session
    acts:
      - start-trace
    outputs:
      - name: trace_id
        type: string
      - name: trace
        type: object

  - id: witness
    name: Witness Judgement
    description: Create the witness for the target judgement
    acts:
      - witness-judgement
    depends_on:
      - start
    inputs:
      - name: target_id
        type: string
        required: true
      - name: judgement_type
        type: string
        required: false
        default: observation
    outputs:
      - name: witness_id
        type: string
      - name: witness
        type: object

  - id: record
    name: Record Step
    description: Record the witnessing step in the trace
    acts:
      - trace-step
    depends_on:
      - witness
    inputs:
      - name: trace
        from_step: start.trace
      - name: operation
        type: string
        required: false
        default: witness-judgement
      - name: payload
        from_step: witness.witness
    outputs:
      - name: step
        type: object

  - id: complete
    name: Complete Trace
    description: Finalize the trace with the judgement result
    acts:
      - complete-trace
    depends_on:
      - record
    inputs:
      - name: trace
        from_step: record.trace
      - name: result
        from_step: witness.witness
    outputs:
      - name: completion
        type: object
