name: policy-regime-example
description: >
  Example runbook that materialises a simple policy regime using the
  govern-regime act, aligning the policy engine with the Discipline /
  Filter acts from the policy stack.
version: "1.0.0"
tags:
  - example
  - policy
  - regime
policy_requirements: []

steps:
  - id: seed_policy_inputs
    name: Seed basic policy regime inputs
    description: Provide identifiers and simple discipline/filter shapes
    acts:
      - seed-observation
    depends_on: []
    inputs:
      - name: payload
        type: any
        required: true
        default:
          policy_id: "example-intake-policy"
          name: "Example intake discipline"
          description: "Allow only intake observations tagged 'intake' and deny others."
          scope: "recognition"
          disciplines:
            - id: "allow-intake"
              name: "Allow intake-tagged recognitions"
              match_tags: ["intake"]
              match_acts: []
              match_types: []
              effect: "allow"
              priority: 200
            - id: "default-deny"
              name: "Default deny"
              match_tags: []
              match_acts: []
              match_types: []
              effect: "deny"
              priority: 0
          filters:
            - id: "mask-secrets"
              name: "Mask secrets field"
              match_path: "secrets"
              action: "mask"
              applies_to_scope: "recognition"
    outputs:
      - name: observation
        type: any

  - id: govern_regime
    name: Materialise policy regime
    description: Use govern-regime to register the policy with the engine
    acts:
      - govern-regime
    depends_on:
      - seed_policy_inputs
    inputs:
      - name: policy_id
        type: string
        required: true
        from_step: seed_policy_inputs.observation.payload.policy_id
      - name: name
        type: string
        required: true
        from_step: seed_policy_inputs.observation.payload.name
      - name: description
        type: string
        required: false
        from_step: seed_policy_inputs.observation.payload.description
      - name: scope
        type: string
        required: false
        from_step: seed_policy_inputs.observation.payload.scope
      - name: disciplines
        type: any
        required: false
        from_step: seed_policy_inputs.observation.payload.disciplines
      - name: filters
        type: any
        required: false
        from_step: seed_policy_inputs.observation.payload.filters
    outputs:
      - name: policy
        type: any
      - name: policy_id
        type: string

