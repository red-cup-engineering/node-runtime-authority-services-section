name: policy-disciplines-example
description: >
  Demonstrate building discipline and filter rules via acts and composing them
  into a regime with govern-regime.
version: "1.0.0"
tags:
  - example
  - policy
  - discipline
  - filter
policy_requirements: []

steps:
  - id: build_intake_discipline
    name: Build intake discipline
    description: Construct a discipline rule for intake-tagged recognitions
    acts:
      - discipline
    depends_on: []
    inputs:
      - name: name
        type: string
        required: true
        default: "intake-allow"
      - name: description
        type: string
        required: false
        default: "Allow recognitions tagged 'intake'"
      - name: match_tags
        type: any
        required: false
        default:
          - intake
      - name: effect
        type: string
        required: false
        default: allow
    outputs:
      - name: discipline_rule
        type: any

  - id: build_admin_discipline
    name: Build admin discipline
    description: Construct a discipline rule for admin-tagged recognitions
    acts:
      - discipline
    depends_on: []
    inputs:
      - name: name
        type: string
        required: true
        default: "admin-allow"
      - name: description
        type: string
        required: false
        default: "Allow recognitions tagged 'admin'"
      - name: match_tags
        type: any
        required: false
        default:
          - admin
      - name: effect
        type: string
        required: false
        default: allow
    outputs:
      - name: discipline_rule
        type: any

  - id: compose_disciplines
    name: Compose disciplines
    description: Combine intake and admin disciplines into a composite discipline
    acts:
      - compose-discipline
    depends_on:
      - build_intake_discipline
      - build_admin_discipline
    inputs:
      - name: disciplines
        type: any
        required: true
        default: []
        from_step: build_intake_discipline.discipline_rule
    outputs:
      - name: discipline_rule
        type: any

  - id: build_mask_filter
    name: Build masking filter
    description: Construct a filter rule that masks 'secrets' field
    acts:
      - filter
    depends_on: []
    inputs:
      - name: name
        type: string
        required: true
        default: "mask-secrets"
      - name: description
        type: string
        required: false
        default: "Mask the 'secrets' field"
      - name: match_path
        type: string
        required: false
        default: secrets
      - name: action
        type: string
        required: false
        default: mask
    outputs:
      - name: filter_rule
        type: any

  - id: build_remove_filter
    name: Build removal filter
    description: Construct a filter rule that removes 'internal' field
    acts:
      - filter
    depends_on: []
    inputs:
      - name: name
        type: string
        required: true
        default: "remove-internal"
      - name: description
        type: string
        required: false
        default: "Remove the 'internal' field"
      - name: match_path
        type: string
        required: false
        default: internal
      - name: action
        type: string
        required: false
        default: remove
    outputs:
      - name: filter_rule
        type: any

  - id: compose_filters
    name: Compose filters
    description: Combine masking and removal filters into a composite filter
    acts:
      - compose-filter
    depends_on:
      - build_mask_filter
      - build_remove_filter
    inputs:
      - name: filters
        type: any
        required: true
        default: []
        from_step: build_mask_filter.filter_rule
    outputs:
      - name: filter_rule
        type: any

  - id: govern_policy
    name: Govern policy regime
    description: Materialise a policy regime from composed disciplines and filters
    acts:
      - govern-regime
    depends_on:
      - compose_disciplines
      - compose_filters
    inputs:
      - name: policy_id
        type: string
        required: true
        default: "example-composed-policy"
      - name: name
        type: string
        required: true
        default: "Example composed policy regime"
      - name: description
        type: string
        required: false
        default: "Policy regime built from discipline/filter acts"
      - name: disciplines
        type: any
        required: true
        from_step: compose_disciplines.discipline_rule
      - name: filters
        type: any
        required: true
        from_step: compose_filters.filter_rule
    outputs:
      - name: policy
        type: any
      - name: policy_id
        type: string

