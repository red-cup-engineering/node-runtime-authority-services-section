name: quasicrystalline-sheaf-section
description: >
  Build a simple profile tower and seed it as an observation representing
  a minimal section of the quasicrystalline hypertensor sheaf.
version: "1.0.0"
tags:
  - example
  - hypertensor-sheaf
  - tower
policy_requirements: []

steps:
  - id: build_profile_tower
    name: Build profile tower
    description: Build a simple profile tower of height 2
    acts:
      - build-profile-tower
    depends_on: []
    inputs:
      - name: base_profile
        type: any
        required: true
        default:
          id: "sheaf-fibre-profile"
          description: "Base profile for a minimal sheaf section"
      - name: height
        type: number
        required: true
        default: 2
    outputs:
      - name: tower
        type: any
      - name: tower_id
        type: string
      - name: sheaf_section
        type: any

  - id: seed_sheaf_section
    name: Seed sheaf section
    description: >
      Treat the built tower as a minimal section of the hypertensor sheaf
      over a single fibre and persist it as an observation TracePoint.
    acts:
      - seed-observation
    depends_on:
      - build_profile_tower
    inputs:
      - name: payload
        type: any
        required: true
        from_step: build_profile_tower.sheaf_section
    outputs:
      - name: section_id
        type: string
      - name: section
        type: any
