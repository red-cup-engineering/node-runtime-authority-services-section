name: observation-equivalence-evaluation-example
description: >
  Seed two equivalent observations, flow them, record equivalence, and evaluate
  their equivalence using evaluate-observation-equivalence.
version: "1.0.0"
tags:
  - example
  - observation
  - equivalence
  - evaluation
policy_requirements: []

steps:
  - id: seed_left
    name: Seed left observation
    description: Seed the first observation with a simple value
    acts:
      - seed-observation
    depends_on: []
    inputs:
      - name: payload
        type: any
        required: true
        default:
          value: 1
    outputs:
      - name: observation
        type: any

  - id: seed_right
    name: Seed right observation
    description: Seed the second observation with an equivalent value
    acts:
      - seed-observation
    depends_on: []
    inputs:
      - name: payload
        type: any
        required: true
        default:
          value: 1
    outputs:
      - name: observation
        type: any

  - id: recognize_left
    name: Recognize left value
    description: Recognize the value of the left observation
    acts:
      - recognize-value
    depends_on:
      - seed_left
    inputs:
      - name: value
        type: any
        required: true
        from_step: seed_left.observation.payload.value
    outputs:
      - name: recognition
        type: any

  - id: recognize_right
    name: Recognize right value
    description: Recognize the value of the right observation
    acts:
      - recognize-value
    depends_on:
      - seed_right
    inputs:
      - name: value
        type: any
        required: true
        from_step: seed_right.observation.payload.value
    outputs:
      - name: recognition
        type: any

  - id: flow_left
    name: Flow left observation
    description: Flow the left observation through a simple context
    acts:
      - flow-observation
    depends_on:
      - seed_left
    inputs:
      - name: observation
        type: any
        required: true
        from_step: seed_left.observation
      - name: context
        type: any
        required: false
        default:
          kind: evaluation
    outputs:
      - name: observation
        type: any
      - name: flow
        type: any

  - id: flow_right
    name: Flow right observation
    description: Flow the right observation through the same context
    acts:
      - flow-observation
    depends_on:
      - seed_right
    inputs:
      - name: observation
        type: any
        required: true
        from_step: seed_right.observation
      - name: context
        type: any
        required: false
        default:
          kind: evaluation
    outputs:
      - name: observation
        type: any
      - name: flow
        type: any

  - id: record_equivalence
    name: Record observation equivalence
    description: Record that the flowed observations remain equivalent
    acts:
      - flow-observation-equivalence
    depends_on:
      - flow_left
      - flow_right
    inputs:
      - name: left_observation
        type: any
        required: true
        from_step: flow_left.observation
      - name: right_observation
        type: any
        required: true
        from_step: flow_right.observation
      - name: context
        type: any
        required: false
        default:
          kind: evaluation
    outputs:
      - name: equivalence
        type: any

  - id: evaluate_equivalence
    name: Evaluate observation equivalence
    description: Evaluate whether recognised values for the two observations match
    acts:
      - evaluate-observation-equivalence
    depends_on:
      - record_equivalence
      - recognize_left
      - recognize_right
    inputs:
      - name: equivalence
        type: any
        required: true
        from_step: record_equivalence.equivalence
      - name: left_recognition
        type: any
        required: true
        from_step: recognize_left.recognition
      - name: right_recognition
        type: any
        required: true
        from_step: recognize_right.recognition
    outputs:
      - name: evaluation
        type: any
      - name: equivalent
        type: boolean

