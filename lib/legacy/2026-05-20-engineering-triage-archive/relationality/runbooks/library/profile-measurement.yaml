name: profile-measurement-example
description: >
  Example runbook demonstrating profile-measure and profile-integral
  as measurement algebra instructions over arbitrary targets.
version: "1.0.0"
tags:
  - example
  - measurement
policy_requirements: []

steps:
  - id: seed_value
    name: Seed value as observation
    description: Seed an arbitrary payload as an observation
    acts:
      - seed-observation
    depends_on: []
    inputs:
      - name: payload
        type: any
        required: true
    outputs:
      - name: observation_id
        type: string
      - name: observation
        type: any

  - id: measure_value
    name: Measure observable on payload
    description: Use profile-measure to compute a simple observable
    acts:
      - profile-measure
    depends_on:
      - seed_value
    inputs:
      - name: target
        type: any
        required: true
        from_step: seed_value.observation
      - name: observable_type
        type: string
        required: false
        default: count
    outputs:
      - name: measurement
        type: any
      - name: measurement_id
        type: string
      - name: value
        type: number

  - id: aggregate_measurements
    name: Aggregate measurements
    description: Aggregate a list of measurements via profile-integral
    acts:
      - profile-integral
    depends_on:
      - measure_value
    inputs:
      - name: measurements
        type: any
        required: true
        from_step: measure_value.measurement
      - name: aggregation_type
        type: string
        required: false
        default: sum
    outputs:
      - name: aggregate
        type: any
      - name: aggregate_id
        type: string
      - name: value
        type: number

