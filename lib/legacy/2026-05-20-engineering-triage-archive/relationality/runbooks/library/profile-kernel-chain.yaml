name: profile-kernel-chain-example
description: >
  Build a profile tower, attach an observation kernel to one level, summarise
  the resulting profile kernel chain, and mark it as fixed.
version: "1.0.0"
tags:
  - example
  - topology
  - tower
  - kernel
policy_requirements: []

steps:
  - id: build_profile_tower
    name: Build profile tower
    description: Build a simple profile tower of height 3
    acts:
      - build-profile-tower
    depends_on: []
    inputs:
      - name: base_profile
        type: any
        required: true
        default:
          id: "base-profile"
          description: "Base profile for kernel chain example"
      - name: height
        type: number
        required: true
        default: 3
      - name: metadata
        type: any
        required: false
        default:
          domain: "physics"
    outputs:
      - name: tower
        type: any

  - id: build_kernel
    name: Build observation kernel
    description: Build a simple observation kernel over two states
    acts:
      - observation-kernel
    depends_on: []
    inputs:
      - name: states
        type: any
        required: true
        default:
          - id: "s0"
          - id: "s1"
      - name: transition_law
        type: any
        required: true
        default:
          s0:
            s0: 0.9
            s1: 0.1
          s1:
            s0: 0.2
            s1: 0.8
    outputs:
      - name: kernel
        type: any
      - name: kernel_id
        type: string

  - id: apply_profile_kernel_step_level1
    name: Apply profile kernel step at level 1
    description: Attach the observation kernel to tower level 1
    acts:
      - profile-kernel-step
    depends_on:
      - build_profile_tower
      - build_kernel
    inputs:
      - name: tower
        type: any
        required: true
        from_step: build_profile_tower.tower
      - name: level
        type: number
        required: true
        default: 1
      - name: kernel
        type: any
        required: true
        from_step: build_kernel.kernel
    outputs:
      - name: tower
        type: any

  - id: apply_profile_kernel_step_level2
    name: Apply profile kernel step at level 2
    description: Attach the observation kernel to tower level 2
    acts:
      - profile-kernel-step
    depends_on:
      - apply_profile_kernel_step_level1
    inputs:
      - name: tower
        type: any
        required: true
        from_step: apply_profile_kernel_step_level1.tower
      - name: level
        type: number
        required: true
        default: 2
      - name: kernel
        type: any
        required: true
        from_step: build_kernel.kernel
    outputs:
      - name: tower
        type: any

  - id: build_profile_kernel_chain
    name: Build profile kernel chain
    description: Summarise kernel witnesses across tower levels
    acts:
      - profile-kernel-chain
    depends_on:
      - apply_profile_kernel_step_level2
    inputs:
      - name: tower
        type: any
        required: true
        from_step: apply_profile_kernel_step_level2.tower
      - name: kernel
        type: any
        required: true
        from_step: build_kernel.kernel
    outputs:
      - name: chain
        type: any
      - name: profile_kernel_chain
        type: any

  - id: compute_fixed_chain
    name: Compute fixed profile kernel chain
    description: Mark the profile kernel chain as fixed/stationary
    acts:
      - fixed-chain
    depends_on:
      - build_profile_kernel_chain
    inputs:
      - name: chain
        type: any
        required: true
        from_step: build_profile_kernel_chain.profile_kernel_chain
    outputs:
      - name: fixed_chain
        type: any

